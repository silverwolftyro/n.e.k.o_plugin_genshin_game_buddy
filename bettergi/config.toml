# genshin_game_buddy · BetterGI 桥接配置
# ══════════════════════════════════════════════════════════════════════
# 本文件由插件自己用标准库 tomllib 读取（不走宿主配置体系）。
# 改完保存即可生效；插件重启时重新加载。
#
# ★ 2026-11-07：从独立插件 bettergi_companion 物理并入 genshin_game_buddy。
#   本文件现在是 ggb 插件目录下的 bettergi/config.toml。
#
# ⚠ 宿主安装场景下插件目录可能被替换，长期配置建议同时用宿主配置面板
#   （[genshin_game_buddy.bettergi] 段）—— 面板里的值优先于本文件。
# ══════════════════════════════════════════════════════════════════════

[webhook]
host = "127.0.0.1"
port = 17890
path = "/bettergi"
# 防重放窗口（秒）：payload 里带 timestamp 且偏差超过这个值就拒收（409）。
# 设为 0 = 关闭该校验。
replay_window_s = 300

# ── 反向控制：YUI 指挥 BetterGI ─────────────────────────────────────
# enabled     : 总开关。**默认 true** —— 反向控制已经是本插件的核心功能，
#               不该让用户先翻配置文件才能用。
#               没装 BetterGI 侧的 JS 代理脚本也不要紧：启动自检会发现
#               通道没接上，让 YUI 主动提醒你跑一下「一键配置.bat」。
#               确实不想用反向控制，把它改成 false 即可。
# ack_timeout_s: 指令发出后等 BetterGI 回执的秒数。超时 = 判定失败，
#               YUI 会告诉用户「指令没发出去」。
# poll_hold_s : BetterGI 侧 GET /bettergi/command 的长轮询保持时长。
#               越大指令下发越及时，但 BetterGI 侧空转等待也越久。
# self_check_delay_s : 启动后等多少秒做第一次「通道通没通」的自检。
# self_check_repeat_s: 没连上时每隔多少秒再提醒一次。
# self_check_max     : 最多提醒几次（0 = 完全不提醒）。

[control]
enabled = true
ack_timeout_s = 15
poll_hold_s = 5
self_check_delay_s = 15
self_check_repeat_s = 120
self_check_max = 2

# ── 陪玩参数（Companion Mode，2026-10-29）──────────────────────────────
# scene_group_cooldown_s : 同一场景组内「非关键台词」的最小间隔（秒）。
#   场景组分四组：WORLD / COMBAT / MENU / TRANSITION。
#   一次战斗就是「开打 ->（可能失败）-> 打完了」，属于同一组，
#   所以这三句会被同一把锁压住，90s 内只播一句。
#   ★ 用户主动推的台词（js.custom）和手动测试（notify.test）不受此限。
#   调成 0 = 关掉这一层，退回改造前的行为。
# ──────────────────────────────────────────────────────────────────────

[yui]
# ⚠ 仅 BetterGI 内部使用；攻略主路径冷却以 event_to_yui.py 为准
scene_group_cooldown_s = 90

# ── 事件 → 台词映射 ──────────────────────────────────────────────────
# enabled      : 关掉就不念这个事件
# lines        : 台词池，每次随机抽一句
# cooldown_s   : 同一个事件在多少秒内不重复（限流）
# passthrough  : true = 原样念出 BetterGI 传来的文本，不走 lines

[events.domain.start]
enabled = true
lines = [
  "来了来了，主人尽管冲，我在旁边看着~",
  "打架了打架了！……主人小心点呀。",
  "开打！输了我可不哄你哦~",
  "自动打手上线啦，主人快找好位置看戏~",
]
cooldown_s = 10

[events.domain.end]
enabled = true
lines = [
  "打完啦~ 主人歇会儿吧，喘口气。",
  "呼——总算结束了，主人喝水去。",
  "辛苦了笨蛋主人，我给你记着战绩呢。",
  "自动打手完工啦，主人快来验收战绩~",
]
cooldown_s = 10

[events.task.error]
enabled = true
lines = [
  "哎呀，这次没成……主人再试一次嘛。",
  "唔……失败了。要不换个打法？",
  "又扑空了。主人是不是走神啦~",
  "哎呀，自动打手卡壳了，主人快去帮帮它。",
]
cooldown_s = 30

[events.js.custom]
enabled = true
passthrough = true   # 原样念出 data 字段
cooldown_s = 10

# BetterGI 设置里的「测试 WebHook 通知」按钮发的是 notify.test。
# 映射它，手动验证时点一下就能看见 YUI 回应。
[events.notify.test]
enabled = true
lines = ["收到收到，通道通了！"]
cooldown_s = 10
