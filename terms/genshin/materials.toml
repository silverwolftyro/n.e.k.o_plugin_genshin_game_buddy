description = "钓鱼过程中，若能使张力保持在最佳张力区，使用此竿可加速缩短鱼儿挣扎时间，若离开最佳张力区，加速过程会被重置。\n\n因「海中月」而生的特制长竿。为了应对传说中的大鱼，制作者特别在竿身、鱼线中掺入了罕见的功能材料，使其不仅拥有不俗的延展性，更能承千斤而不崩。如此宝具，用来对付普通鱼儿自然也不在话下，但总是这样牛鼎烹鸡的话，它也会感到负尘蒙羞吧？"

