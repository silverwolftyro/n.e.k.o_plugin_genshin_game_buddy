description = "名中带鱼却不属鱼的中型两栖生物，外形独特，有着拳刃般别致的扁平头部，似乎随时能与天敌激烈战斗。实际上，它们天性温和，并不好斗，这种头部构造只是为了减少在河中游动时的水流阻力。得益于这种头部构造，它们能够破开湍急的逆流，在各个水域自如地穿梭，因而获称「斗士急流鱼」。\n生活在液态燃素中的斗士急流鱼亚种有着格外坚韧的表皮，耐受高温的能力尤为出色，被誉为「无法做成烤鱼的鱼」。当然，大部分钓鱼爱好者钓获了炽岩斗士急流鱼后，都会将它们当成珍贵的观赏鱼用心饲养，而不是送进厨房…"

[[materials]]
name = "维护机关·澄金领队型"
slug = "maintenancemekgoldleader"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "为了辅助水下活动的发条机关，提升机队总出勤率而开发的紧凑型辅助机关。最初的设计目的是清除水下的垃圾、植物残渣等杂物，避免它们吸附在发条机关关键部位，从而尽可能降低发条机关的故障率。从另一种角度看，它们无疑也扮演着「水下清洁工」的角色，对枫丹的生态环境有益。\n相较于其他量产型号，这一特别的「澄金领队型」维护机关采用了澄澈金色的壳体，以及特别的控制设备。在开发组的设想中，在较为复杂的水下地形活动时，这种维护机关能作为一种高效能的「中继指挥站」，接收并向周围的维护机关分发控制者所下达的各类指令，可以说是宛如「领队」一般的重要机关。\n然而，随着维护机关项目的整体停转，这些「领队机关」们失去了存在的意义，唯有它们富有辨识度的，澄澈金色的外表，使得它们在一些鱼师的眼中具有极高的收藏价值。"

[[materials]]
name = "维护机关·初始能力型"
slug = "maintenancemekinitialconfiguration"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "为了辅助水下活动的发条机关，提升机队总出勤率而开发的紧凑型辅助机关。最初的设计目的是清除水下的垃圾、植物残渣等杂物，避免它们吸附在发条机关关键部位，从而尽可能降低发条机关的故障率。从另一种角度看，它们无疑也扮演着「水下清洁工」的角色，对枫丹的生态环境有益。\n这种机关搭载了灵敏的传感器，能有效用「嗅觉」寻获目标物，或是发现水下垃圾的光学特征。因此，有时它们也会被一些鱼饵吸引。钓上了这种机关的鱼师则将它们称为「水域维护鱼」或「铁鱼」。\n采用轻型木材和低成本金属的这一型号是维护机关稳定量产后的第一批次型号，具备达成设计目的的「初始行动能力」。但使用寿命本身也不太理想。因此，这一型号的投放量相当之大，采取了「分组开机轮替」的模式，即一部分机关活动时限结束或故障瘫痪后，另一部分预先隐藏在水下的机关开机活动，接替岗位。因此，在普通人看来，这些「铁鱼」就像是会自行繁殖一样，源源不断地涌现出来。偶尔钓上来几条，也不需要有什么负罪感。"

[[materials]]
name = "维护机关·白金典藏型"
slug = "maintenancemekplatinumcollection"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "为了辅助水下活动的发条机关，提升机队总出勤率而开发的紧凑型辅助机关。最初的设计目的是清除水下的垃圾、植物残渣等杂物，避免它们吸附在发条机关关键部位，从而尽可能降低发条机关的故障率。\n相较于其他量产型号，这一特别的「白金典藏型」维护机关采用了光洁亮丽的壳体，是该开发组专门生产的纪念型号。该组在游说一些财力雄厚的商人，为维护机关项目招商引资时，会将这种纪念品赠送给商人，作为鱼缸中的精致观赏物，的确相当难得。可惜的是，该组所有吸引投资的尝试都以失败告终，转而计划将这种维护机关作为玩具出售，补贴日渐亏空的项目经费池。\n最终，随着那场人尽皆知的事故，整个维护机关开发组彻底停摆，维护机关的后续项目也被取消。目前，枫丹水域内该谱系的维护机关全都无人管理。预先生产的一批「白金典藏型」也全部沉入水中，不知去向，成为了枫丹水域最富特色，也是最昂贵的「鱼类」。随着科学院的一些项目公开，《蒸汽鸟报》的记者们对比资料，深入调查，发现「维护机关投放前后，枫丹水域的污染状况其实并没有显著变化，该项目的效能值得怀疑」。此后，尚能活动的「白金典藏型」维护机关依旧在枫丹的水域中游弋着，鱼师们也开始以钓到「白金典藏型」为荣，毕竟「白金典藏型」的稀有程度和其他国家最珍贵的观赏鱼旗鼓相当。"

[[materials]]
name = "维护机关·态势控制者"
slug = "maintenancemeksituationcontroller"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "为了辅助水下活动的发条机关，提升机队总出勤率而开发的紧凑型辅助机关。最初的设计目的是清除水下的垃圾、植物残渣等杂物，避免它们吸附在发条机关关键部位，从而尽可能降低发条机关的故障率。从另一种角度看，它们无疑也扮演着「水下清洁工」的角色，对枫丹的生态环境有益。\n这种机关搭载了灵敏的传感器，能有效用「嗅觉」寻获目标物，或是发现水下垃圾的光学特征。因此，有时它们也会被一些鱼饵吸引。钓上了这种机关的鱼师则将它们称为「水域维护鱼」或「铁鱼」。\n某些特定情境下，维护机关会将一些水下生物的食物当成垃圾清理，并与水下生物发生冲突，功率较低的小型机关自然占不到上风。久而久之，如此折损的维护机关总量愈发悲观。\n为了保护前两种型号的维护机关，让它们安全地清理水域，研究员们沿用了已有的框架，尽可能提高核心机构的功率密度，开发出了具备一定战斗能力的第三种型号，试图让它们用撞击的方式驱离水下生物，从而为其他维护机关维持一个正常工作的态势，并以原有的生产链快速大量投产。\n然而，研究员们后续加强「态势控制者」的开发计划被枫丹科学院紧急叫停了，毕竟「如果这种小东西都能打跑凶猛的水下生物，那还要原来那些水下机关有什么用！」。事实也证明，这些「态势控制者」根本无法驱赶不利的水下生物，反倒只能「清理」一些普通鱼类，对环境造成严重破坏。因此，研究员们还专门关停了一部分「态势控制者」，并对其攻击行为进行了限制。"

[[materials]]
name = "维护机关·水域清理者"
slug = "maintenancemekwaterbodycleaner"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "为了辅助水下活动的发条机关，提升机队总出勤率而开发的紧凑型辅助机关。最初的设计目的是清除水下的垃圾、植物残渣等杂物，避免它们吸附在发条机关关键部位，从而尽可能降低发条机关的故障率。从另一种角度看，它们无疑也扮演着「水下清洁工」的角色，对枫丹的生态环境有益。\n这种机关搭载了灵敏的传感器，能有效用「嗅觉」寻获目标物，或是发现水下垃圾的光学特征。因此，有时它们也会被一些鱼饵吸引。钓上了这种机关的鱼师则将它们称为「水域维护鱼」或「铁鱼」。\n相比于大量铺货的「初始能力型」，这一更为成熟的量产型号「水域清理者」的表面刷有耐腐蚀能力极强的涂层，而且，该项目的研究员，不再采用一次性投放，投放后不理的运行方案，而是为其引入了周期性回收维护的设计——研究员们会用特定频率的闪光向维护机关的传感器发送归航信号，将它们回收，适当修理与检查，再放回水中继续工作。这种特定频率的闪光后来则演变成一种专门针对维护机关族群的鱼饵，通过不明渠道，在普通鱼师的群体中流传了开来。"

