sources = ["30级以上「冰风组曲」掉落"]
description = "属于歌裴莉娅的奇械发条备件，能够为奇械舞者提供能源。\n在制造者的构想中，有着纤细关节的奇械舞者的故事停留在欢快的一瞬。歌裴莉娅将会以超凡的战斗能力为任何试图搅扰此刻的不速之客送去厄运的篇章。"

[[materials]]
name = "奇械发条备件·科培琉司"
slug = "artificedspareclockworkcomponentcoppelius"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
