slug = "sugardewbait"
rarity = 2
category = "FISH_BAIT"
category_text = "鱼饵"
sources = ["合成获得"]
description = "以蔷薇花露为基底的鱼饵，混入了晒干后的香辛果粉，入口辛辣，回味却交织甜蜜。如此滋味，一如钓鱼佬的生活。所谓雨打风吹日暴晒，潮涌波汹浪翻天，经受考验后的收获，才格外令人欣喜吧。\n\n适用鱼种：角鲀类、斧枪鱼类。"

