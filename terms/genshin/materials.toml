rarity = 4
category = "AVATAR_MATERIAL"
category_text = "精炼材料"
sources = []
description = "「水仙十字之剑」专用的精炼道具。\n古代枫丹文明喜欢用螺贝制作仪式道具，这个被选做圣杯的螺壳内终于涌现出圣油。从象征意义来说，圣杯是太初的言语，圣油是锤炼的意志，圣剑则是破开一切的理性。"

