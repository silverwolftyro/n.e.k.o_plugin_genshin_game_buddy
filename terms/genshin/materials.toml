category_text = "鱼"
sources = ["钓鱼获得"]
description = "通体浑圆的至冬鱼类，看似与遍布提瓦特的鲀类是远亲，其实分属于截然不同的族系，最早被钓鱼协会记录在案时，代号为「雪国圆鳍鱼」，历经十几代鱼师的变迁，约定俗成的名字演化为「雪圆鳍」。\n据民间传说所述，月光雪圆鳍是至冬鱼类中耐力最强，方向感最佳的品种，因为其先祖远游至挪德卡莱水域，受到月光的洗礼，因而呈现出了这种奇特的色彩。但从挪德卡莱归来的商人否认了这种说法，生物学家也指出，其色彩大概来源于喜食的水底植物。不过由于月光的前缀好听又好记，这个称呼一直被沿用至今…"

