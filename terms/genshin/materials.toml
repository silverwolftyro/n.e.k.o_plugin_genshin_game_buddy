description = "清湛而明耀的苍色凝晶，蕴藏着极度纯净的月矩力，对各类元素力的亲和性也堪称完美。"

[[materials]]
name = "祸神之禊泪"
slug = "tearsofthecalamitousgod"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
