description = "分布在荒原群山的深处，散发着异彩的特殊辉石，似乎是由混化的元素能量凝结而成的。"

[[materials]]
name = "苍星军势的征服"
slug = "triumphofthepalestararmy"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n「所有妖精的庇护主，苍星的继承者，诞生自神圣血脉的我等的帝王，白沙皇！」\n「称颂吧，如今整个冰原已然在极星的辉曜下浑然一体。」\n「称颂吧，诛杀了伪王的皇帝接纳了所有的妖精，竟是如此仁爱和慈悲！」"

[[materials]]
name = "真果角鲀"
slug = "truefruitangler"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "体型圆润的中型鱼类，生有犄角般的软骨结构，据说它们会用这一结构开凿水下洞穴，建造栖身之所，或是驱赶试图伤害自己的生物。\n体表呈现出青绿色彩的角鲀是这一谱系中最常见的品种，状如枝头尚未成熟的果实，因而得名「真果」。\n虽说这种角鲀鱼刺极少，肉质肥美，但要是处理的方式不当，或是摘除胆囊的时间较晚，鱼肉就会像未熟果实般的酸涩。因此，「能否制作鲜美的角鲀料理」也成了衡量须弥厨师技艺的标准之一。"

[[materials]]
name = "混浊棱晶"
slug = "turbidprism"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["40级以上元能构装体掉落", "星尘兑换", "占位-可合成数量:{0}"]
description = "打倒元能构装体后获得的老旧零件。\n据说这些机械与同样来自沙海深处的「遗迹机关」不同，并不是作为歼灭与征服的使者被制造出来的。"

[[materials]]
name = "吞天之鲸·只角"
slug = "tuskofmonoceroscaeli"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["70级以上「公子」挑战奖励", "合成台-转化页签：转化获取"]
description = "战胜解放了邪眼之力的「公子」后，取来的水鲸之角。\n传说中，命之座的图形反映着人的气质。而巡弋漆黑夜空的星辰之鲸，恐怕映照出的是粉碎一切、吞噬一切的狂傲理念吧…\n而接受了这一面的他，欣然唤出灭世的水之鲸，投身与你的战斗。"

[[materials]]
name = "扭曲的枯枝"
slug = "twistedwitheredbranch"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["70级以上多托雷挑战奖励", "合成台-转化页签：转化获取"]
description = "战胜藏身于世界树中的异端者后，从残毁的地脉深处拾得的枯枝。\n自本应隐藏于深邃地底的巨木上生长出的扭曲枝条。即使远离它的原主，其中也残留着怪异邪恶的力量。"

[[materials]]
name = "横行霸者的利齿"
slug = "tyrantsfang"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["60级以上纳塔龙众掉落", "星尘兑换：兑换后合成", "占位-可合成数量:{0}"]
description = "纳塔的强龙脱落的尖锐利齿。\n旁生的锯状结构与其狰狞的形态，可窥见其主人在战斗中的蛮勇。拥有这等牙齿的龙，想必在纳塔诸多龙众中，可称得上是横行无忌的霸者了吧。"

[[materials]]
name = "试验型超燃灯"
slug = "ultrahotburnerlamptestmodel"
rarity = 4
category = "CONSUME"
category_text = "小道具"
sources = []
description = "能够通过消耗矿物，提高食材加工效率的小装置。\n教令院的年轻学者有着利用实验器材进行烹饪的习惯。为了提高效率，节约时间，有人发明了「超燃灯」这种能将矿物中的能量提取出来，增加功率的装置。\n手中的是这种超燃灯的民用试验型，限制了出力功率，消除了明火，以降低火灾风险。不过，就算如此，还是能够熬制果酱、烘干香肠，十分方便。"

[[materials]]
name = "无秽的月铁"
slug = "unblemishedlunariron"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["60级以上先驱秘源统辖阵列掉落", "星尘兑换：兑换后合成", "占位-可合成数量:{0}"]
description = "击败游荡于月面的古老机关后，自其内部取得的核心。似乎与提瓦特常见的金属有所不同。\n未曾沾染地上污秽之物，弃绝七灾八苦的永恒之物，曾一度渴慕向无尽深空歌唱之物——在一切演算的结末，留在月宫中的，不过只有无用的冷铁而已。"

[[materials]]
