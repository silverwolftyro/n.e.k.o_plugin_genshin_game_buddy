slug = "flamingflowerstamen"
rarity = 0
category = "EXCHANGE"
category_text = "素材"
sources = ["野外采集", "推荐：千风神殿采集"]
description = "火辣辣的花芯。熊熊燃烧的炙热花朵，即使被水浇熄了也隐隐地放出热量。"

[[materials]]
name = "燃爆木"
slug = "flammabombwood"
rarity = 1
category = "WOOD"
category_text = "素材"
sources = ["野外采集", "推荐：纳塔野外砍伐", "洞天百宝·木材购买获取", "木材转化"]
description = "产自「燃爆树」的木材，与名字不同，这种木材经过「沃陆之邦」推荐的方法处理后，不易燃不易爆，相当可靠。\n可用于制作摆设。"

[[materials]]
name = "长夜燧火的明焰"
slug = "flareoflongnightflint"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n口衔燃芯的夜莺即是执灯人的徽记。\n据说在过去，夜莺的纹章曾属于北国某个声名烜赫的贵族家系。曾几何时，在灯火不抵的阴影中，后来以大盗闻名诸国的少年亦是仿照夜莺的形貌，与挚友共同刻下了最初的鸦印。\n但那也已经是许多年前的事了。时至今日，鸦印已经遍及大地四方，而黑鸦曾仰望的夜莺依然留驻在高塔上，向光明低唱着冬都的哀歌。"

[[materials]]
name = "维护机关频闪诱饵"
slug = "flashingmaintenancemekbait"
rarity = 2
category = "FISH_BAIT"
category_text = "鱼饵"
sources = ["合成获得"]
description = "极为特殊的「诱捕装置」，传说运用了枫丹科学院某开发组外流的技术。装置外部装有金属制作的保护笼和咬钩筋条，内部则是含有茉洁草提取物的灯具。\n投入水中后，装置内部的灯具会以特定频率闪烁，吸引附近的「维护机关」，也就是人们俗称的「水域维护鱼」或「铁鱼」。「维护机关」们的咬力强大，但也只能咬到外部的特质筋条，并牢牢固定在上边。本质上，这也算得上是一种特别的「鱼饵」，专用于钓获价值不菲的「铁鱼」。\n\n适用鱼种：维护机关类。"

[[materials]]
name = "植绒草"
slug = "flockingweed"
rarity = 0
category = "EXCHANGE"
category_text = "至冬区域特产"
sources = ["推荐：霜殛寒峰采集", "尘歌壶种植", "前往采集"]
description = "一度被怀疑是植物与动物结合后的奇妙植株，但后来被证明只不过是单纯长着类似动物绒毛的植物罢了。"

[[materials]]
name = "繁花斗士急流鱼"
slug = "floralrapidfightingfish"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "名中带鱼却不属鱼的中型两栖生物，外形独特，有着拳刃般别致的扁平头部，似乎随时能与天敌激烈战斗。实际上，它们天性温和，并不好斗，这种头部构造只是为了减少在河中游动时的水流阻力。得益于这种头部构造，它们能够破开湍急的逆流，在各个水域自如地穿梭，因而获称「斗士急流鱼」。\n明艳粉红的斗士急流鱼被人们冠以「繁花」的前缀，部分游客还误以为它们和「花羽会」或「绒翼龙」有关。据说在有着红褐岩石的浅滩上，这种伪装色对于它们的天敌异常有效。"

[[materials]]
name = "面粉"
slug = "flour"
rarity = 0
category = "EXCHANGE"
category_text = "食材"
sources = ["烹饪加工获得"]
description = "由小麦磨成的粉末。无论做成怎样的主食，都能给食客的胃带来片刻充实。"

[[materials]]
name = "长犀圆鸟和扁鱼"
slug = "flowhornflounderfinder"
rarity = 4
category = "FISH_ROD"
category_text = "鱼竿"
sources = ["纳塔钓鱼协会兑换"]
description = "钓鱼过程中，若能使张力处于最佳张力区，使用此竿可稳定缩短鱼儿挣扎时间，提高钓鱼成功率。仅纳塔地区生效。\n\n纳塔钓鱼协会特有的鱼竿，以精雕细琢的长颈角犀和浮流鸟装扮点缀竿体，材质则选用了武器级金属，兼顾趣味与耐用性。\n钓鱼佬们时常猜想，有着修长脖子的长颈角犀或许能成为自然界最优秀的鱼师，而看似笨拙的浮流鸟需要捕鱼为生，两者堪称绝妙的搭档，同时出现在鱼竿上，必定能为鱼师带来绝佳的钓鱼运！"

[[materials]]
name = "幽灯蕈"
slug = "fluorescentfungus"
rarity = 0
category = "EXCHANGE"
category_text = "稻妻区域特产"
sources = ["推荐：鹤观采集", "前往采集"]
description = "如同夜灯般微微发光的蘑菇，其中蕴含着不可思议的力量。"

[[materials]]
name = "原海麟角"
slug = "fontemerunihorn"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["30级以上千年珍珠骏麟掉落"]
description = "千年珍珠骏麟的放电器官，也是象征它的伟大超越的王器。已经在与挑战者的战斗中折断了。\n作为自泡泡海马成长而来的顶尖掠食者，千年珍珠骏麟的进化之旅与别的原海异种截然不同：并不是基于原本的物种结构而进化得更大、更强壮，而是生出了泡泡海马所不具备的肢体、犄角，甚至连同骨骼、肌肉都发生了变化。比起原本应有的形态，它的身姿更像古老传说中的幻兽。在诗人与剧作家的幻想中，即使是海马也会有骐骥在大地上驰骋、跃动的姿态。"

[[materials]]
name = "禁咒绘卷"
slug = "forbiddencursescroll"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["60级以上丘丘萨满掉落", "星尘兑换：兑换后合成", "占位-可合成数量:{0}"]
description = "绘制着古代形象的古书抄本。鲜有人能解读它的含义；据说最终理解了其中真意的学者都陷入了癫狂。"

[[materials]]
name = "外世突触"
slug = "foreignsynapse"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["40级以上隙境原体掉落", "星尘兑换", "占位-可合成数量:{0}"]
description = "隙境原体留下的碎屑。\n这种异形生命体的根源是厄里那斯，活动范围也以厄里那斯为主。"

[[materials]]
name = "佛玛洛鳐"
slug = "formaloray"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "曾经一度被认为是幻想生物的奇异鳐鱼，只被记录在一些海祇岛的古老画卷中。如今随着尘封的海渊被打开，它们的真实样貌才展现在人们眼前。\n据传这种奇异生物的体色会随着时间的变化而变化，幼年时通常呈现出如同皦日一般的浅金色，成年后体色会变深，双翼也被如同夜幕一般的暗紫色覆盖。在古画卷的记录中，这个时期的它们被冠以「佛玛洛」之名，其意为「贪婪之口」。"

[[materials]]
name = "石化的骨片"
slug = "fossilizedboneshard"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["60级以上幼岩龙蜥掉落", "60级以上岩龙蜥掉落", "60级以上深海龙蜥掉落", "星尘兑换：兑换后合成", "占位-可合成数量:{0}"]
description = "击败龙蜥后有时能找到的石化骨片。\n龙蜥都梦想着成长为真正的龙。会把古老的化石认作是龙之骨而加以珍惜，或许是因为希冀着龙的永恒与强大吧。"

[[materials]]
name = "禽肉"
slug = "fowl"
rarity = 0
category = "EXCHANGE"
category_text = "食材"
sources = ["动物掉落"]
description = "禽类的新鲜肉块。经过适当处理可以制成让人精神一振的佳肴。"

[[materials]]
name = "深黯的裂眼"
slug = "fracturedeyeofthedeepshadow"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["深黯钓客掉落", "星尘兑换"]
description = "自异界侵入的钓客，在形体消散后留下的残屑。\n表壳碎裂后，寄宿在其中的恶意也随之消泯。"

[[materials]]
name = "残失的焰剑"
slug = "fracturedflaminghilt"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["40级以上辖域守护者掉落", "星尘兑换", "占位-可合成数量:{0}"]
description = "辖域守护者所持的焰剑熄灭后遗留下的剑柄。\n发火焰的宝剑是审判的象征，依仗「空」之权柄，封堵了逾越与亵渎的道路。"

[[materials]]
name = "残损的月铁"
slug = "fracturedlunariron"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["先驱秘源统辖阵列掉落", "星尘兑换"]
description = "击败游荡于月面的古老机关后，自其内部取得的残片。似乎与提瓦特常见的金属有所不同。\n各国失落的古老民话中，往往有着英雄将空月赐予的「神铁」锻为无坚不摧的兵刃，战胜仇敌或魔怪的传说。"

[[materials]]
name = "脆弱的骨片"
slug = "fragileboneshard"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["幼岩龙蜥掉落", "岩龙蜥掉落", "深海龙蜥掉落", "星尘兑换"]
description = "从龙蜥身上找到的某种骨片。\n尽管十分脆弱，其中似乎蕴含着某种难以言喻的力量。"

[[materials]]
name = "金色旋律的断章"
slug = "fragmentofagoldenmelody"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["30级以上魔像督军掉落"]
description = "半人马魔像胸前掉落的金色别章。与之连缀的碎石上所镌刻着的曲调，似乎是某部宏大乐剧的断章。\n曾有人认为，永恒幸福的谐和音律将会响彻寰宇，直至一切命运的尽头，但谐律亦会变奏。最终，当叛逆的神王跌落王座，不朽的王都化为丘墟，失去了军团的统帅手中的琴又要为谁人奏响呢。"

[[materials]]
name = "悠古弦音的残章"
slug = "fragmentofanancientchord"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["礼包商城兑换"]
description = "赋予武器突破之力的材料。\n琴键已然腐朽的竖琴，其音腔被阻塞，已经无法奏出声响。\n据说，遗忘乐章的后人为复活古老王朝的华丽残迹，曾在木制的机械竖琴上涂刷金漆，徒劳地将之与无言的魔像相配…\n很久很久以后，腐朽走调的竖琴仍旧留在那些沉默的巨像手中，任海浪抚摩，奏出忧伤的余音。"

[[materials]]
name = "高塔孤王的断片"
slug = "fragmentofdecarabiansepic"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n「安德留斯」曾经对高塔的孤王宣战，却也无法损伤王都分毫。若不是「自由」高歌的瞬间让这座城市土崩瓦解，这一切都会继续永远之梦。"

[[materials]]
name = "「童真的断篇」"
slug = "fragmentsofinnocence"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "精炼材料"
sources = []
description = "「嘟嘟可故事集」专用的精炼道具。\n随风散落的断篇，每一页上都写满童趣之事，而尺寸恰好与《嘟嘟可故事集》完美相合。其间满溢的童心与纯真的爱永不褪色，就像书中永无完结的大冒险一样，热忱的童话永远随着其作者的脚步飞扬。"

[[materials]]
name = "垂香木"
slug = "fragrantcedarwood"
rarity = 1
category = "WOOD"
category_text = "素材"
sources = ["野外采集", "推荐：坠星山谷砍伐", "洞天百宝·木材购买获取", "木材转化"]
description = "产自「苍柏」的木材，因其富含油脂，香气别致，有着「垂香木」的别称。\n可用于制作摆设。"

[[materials]]
name = "香气四溢的调料"
slug = "fragrantseasoning"
rarity = 1
category = "CONSUME"
category_text = "消耗品"
sources = []
description = "根据娜扎法琳给的配方，制作出来的调料。带有扑鼻的香气，加入到料理中似乎能激发出更多风味。"

[[materials]]
name = "青蛙"
slug = "frog"
rarity = 0
category = "EXCHANGE"
category_text = "素材"
sources = ["淡水水域采集"]
description = "常见的蛙类，生活在潮湿的环境。总是富有活力。身上会分泌出让人充满活力的物质。"

[[materials]]
name = "冷冽巨斧鱼"
slug = "frostedaxeheadfish"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "形貌独特的鱼类，与斧枪鱼有着一定的亲缘关系。曾有生物学家调侃，斧枪鱼选择了「斧状下腹」，而巨斧鱼选择了「斧状头壳」。\n有着蓝紫背脊的巨斧鱼曾被普通鱼师误认为「来自海冰漂浮的北方水域」，较为珍贵，并将之置于接近冰点的水中饲养。其实，它们独特的色彩来源于不同「无奇巨斧鱼」的进食习惯。若是要研究水域中各种养分的「传导链」，这种鱼类无疑是个很好的样本节点…"

[[materials]]
name = "霜镌的执凭"
slug = "frostetchedwarrant"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["60级以上愚人众特辖队掉落", "星尘兑换：兑换后合成", "占位-可合成数量:{0}"]
description = "配发给愚人众特辖队的执凭。\n镶嵌着霜色晶石的执凭是荣耀的象征，想必执有凭证者已在过去的行动中证明了自己的忠诚与价值。"

[[materials]]
name = "霜仙花"
slug = "frostfairyflower"
rarity = 0
category = "EXCHANGE"
category_text = "至冬区域特产"
sources = ["推荐：至冬堡附近采集", "推荐：白桦雪葬地采集", "尘歌壶种植", "前往采集"]
description = "不管风雪多么严苛亦会绽放的圣洁花朵，总是散发着微弱的令人向往的光芒。"

[[materials]]
name = "霜盏花"
slug = "frostlampflower"
rarity = 0
category = "EXCHANGE"
category_text = "挪德卡莱区域特产"
sources = ["推荐：终夜长茔采集", "推荐：霜月之坊附近采集", "尘歌壶种植", "前往采集"]
description = "形如烛盏的花卉，多生长在水边，香气寒冽素净，有安神的功效。\n花蕊与花茎彼此相异的色彩被认为是两种不同的月矩力的象征，然而霜盏花却是极为罕有的、不会受到月矩力任何影响的植物，因此有时也会被霜月之子的追随者们视为无信者与叛离者的象征。\n据说五百年前的漆黑灾厄结束时，这种造型奇异的花朵才出现在大地上，但这种说法从未得到过严谨的考证。"

[[materials]]
name = "霜月印磐"
slug = "frostmoonseal"
rarity = 4
category = "CONSUME"
category_text = "冒险道具"
sources = ["月之高地探索奖励"]
description = "集齐3个印磐后，可开启乌吉恩圈宝库。\n\n在探索时偶然得到的圆形符印，如能找到纹样相同的3个，似乎就能拼凑出曾经照亮世界的皓月的影迹。"

[[materials]]
name = "霜夜的残照"
slug = "frostnightsglimmer"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["霜夜灵嗣掉落", "星尘兑换"]
description = "击败霜夜灵嗣后，从其角冠上取得的残片。\n传说在遥远的过去，这些高贵的生灵亦是黄金之城的侍仆，辉映于其瞳中的乃是至圣至耀的天光。如今那缕残光早已熄灭，而失却了旧主的灵嗣依然漫行于月下的霜夜，守望无人铭记的誓言。"

[[materials]]
name = "霜夜的煌荣"
slug = "frostnightsglory"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["60级以上霜夜灵嗣掉落", "星尘兑换：兑换后合成", "占位-可合成数量:{0}"]
description = "击败霜夜灵嗣后，从其角冠上取得的骨甲。\n其上萦缠着如月光般柔润的温存，即便是在寒夜最深之时亦不会消退。从某种意义上来说，与霜月之子一样，这是这些高贵的生灵最后的坚守。它们侍奉的旧主已经殒入尘埃，它们的梦中却依然辉耀着金色的煌荣。"

[[materials]]
name = "霜夜的柔辉"
slug = "frostnightsglow"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["40级以上霜夜灵嗣掉落", "星尘兑换", "占位-可合成数量:{0}"]
description = "击败霜夜灵嗣后，从其角冠上取得的碎块。\n在霜月之子最古老的口头传承祷歌中，这些高贵生灵的辉光曾被终北的哲人称作神使无垢的垂怜。尽管垂怜最终未能阻止黄金城的覆灭，也未能让她的后裔免于流离于荒野的命运，但那柔辉依然流淌在角冠上，等待着也许不会再度降临的梦。"

[[materials]]
name = "青仙星花鱼"
slug = "frostpetalstarbloomfish"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "游弋在至冬水域的特殊鱼种，从正面观察，六片鱼鳍呈现出近似星星与雪花的形状，因而被最早发现它的鱼师命名为「星花鱼」。其中青色亚种的色彩与霜仙花的花瓣外缘相仿，因而被冠以「青仙」的前缀。相比同族，青仙星花鱼的感官敏锐，总能远远察觉到危险，进而凭借六片鱼鳍的动力优势快速远逃…"

[[materials]]
name = "果酿饵"
slug = "fruitpastebait"
rarity = 2
category = "FISH_BAIT"
category_text = "鱼饵"
sources = ["合成获得"]
description = "十分常见的鱼饵，由日落果与小麦捣碎发酵揉制而成，入水后能够快速雾化，对小型鱼类有着强烈的吸引力。由于其制作简单、价格低廉、效用优秀，因此又被戏称为「钓鱼佬宝珠」。\n\n适用鱼种：鳉鱼类。"

[[materials]]
name = "蕈兽孢子"
slug = "fungalspores"
rarity = 1
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["蕈兽掉落", "活化状态下蕈兽少量掉落", "枯焦状态下蕈兽少量掉落", "星尘兑换"]
description = "蕈兽留下的零星孢子粉末，闪烁着点点微光。仿佛只需一个喷嚏，便会被吹散得无影无踪。"

[[materials]]
name = "散失的岩神瞳"
slug = "geoculus"
rarity = 0
category = "ELEM_CRYSTAL"
category_text = "冒险道具"
sources = []
description = "浓烈的岩元素能量积聚成的物质。献给岩的神像，能弥补它在漫长岁月中散失的力量。"

[[materials]]
name = "岩之印"
slug = "geosigil"
rarity = 3
category = "CONSUME"
category_text = "七国徽印"
sources = ["璃月地区探索奖励"]
description = "受到璃月大地的岩石认可，获授的印记。\n用来在璃月港内特定的地方兑换特殊道具。"

[[materials]]
name = "鎏金之鳞"
slug = "gildedscale"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["70级以上若陀龙王挑战奖励", "合成台-转化页签：转化获取"]
description = "玄岩之中自然而生的鳞甲，坚韧而沉默，蕴含着「龙王」的威能。\n在无数代蝼蚁归于腐土的岁月中，黄金与黑曜嵌入磐石造就的血肉，蔓延盘生而成甲胄。\n炽热的痛感，无声的呼号，或许皆会在恩怨终结的一刻消散吧。"

[[materials]]
name = "秃秃豆"
slug = "glabrousbeans"
rarity = 0
category = "EXCHANGE"
category_text = "食材"
sources = ["须弥餐馆购买", "枫丹杂货店购买", "纳塔杂货店购买"]
description = "提瓦特常见的豆类作物。带有淡淡的香气，因食用方法多样而被各地民众广泛接受。"

[[materials]]
name = "冰星果"
slug = "glaciafruit"
rarity = 0
category = "EXCHANGE"
category_text = "食材"
sources = ["推荐：至冬采集"]
description = "冻土上的臻冰受到特殊影响后结出来的星状果实，将其生长的枝条拆除后，果实即会落于雪上。"

[[materials]]
name = "琉璃百合"
slug = "glazelily"
rarity = 0
category = "EXCHANGE"
category_text = "璃月区域特产"
sources = ["推荐：璃月港玉京台采集", "推荐：轻策庄采集", "尘歌壶种植", "前往采集"]
description = "极为古老的花卉。据说曾经遍布璃月大地，能将大地的记忆积攒成花期时的芬芳。"

[[materials]]
name = "琉璃花鳉"
slug = "glazemedaka"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "活泼好动的小型鳉鱼，以优美的花瓣型鱼尾闻名。\n有着难以捉摸的行为方式，常能见到它们毫无征兆地挣扎起来，似乎正忍受着某种看不见的痛苦，但在其落单的情况下，便不会发生这种事情。有学者猜测，这可能与它们天生的表演欲有关。"

[[materials]]
name = "闪烁饵"
slug = "glimmeringbait"
rarity = 2
category = "FISH_BAIT"
category_text = "鱼饵"
sources = ["合成获得"]
description = "以亮片为主要结构的鱼饵，涂有少量荧光材料，正确运用时，能发出闪烁的光芒，中央的球体内还装有更小的响珠，模拟小鱼的震动，对至冬的鱼类有着特别的吸引力。\n\n适用鱼种：雪圆鳍类、星花鱼类。"

[[materials]]
name = "晦暗刻像"
slug = "gloomystatuette"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["黑蛇众掉落", "星尘兑换"]
description = "刻画着某人形象的小塑像。\n即使经过了长久的岁月，也没有受到任何损伤。似乎被原本的主人如同圣象一般呵护着。"

[[materials]]
name = "荧草饵"
slug = "glowgrassbait"
rarity = 2
category = "FISH_BAIT"
category_text = "鱼饵"
sources = ["完成鲸井椛任务获得"]
description = "由魔晶矿和海草制成的特殊饵料，会在无光处闪耀，对于那些向往光明的家伙，或许有非凡的吸引力。\n若耗尽可在鲸井椛处重复领取。\n\n适用鱼种：所有鱼类"

[[materials]]
name = "霞色宝珠"
slug = "glowinggem"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "精炼材料"
sources = []
description = "「落霞」专用的精炼道具。\n以层岩巨渊先民的古老工艺精致打磨而成的石珀宝珠。能够微微散发出如同黎明或夕暮的辉光。对于在不见天日的岩窟中，与漆黑之敌战斗的人而言，或许能带来小小的慰藉吧。"

[[materials]]
name = "微光角菌"
slug = "glowinghornshroom"
rarity = 0
category = "EXCHANGE"
category_text = "纳塔区域特产"
sources = ["推荐：镜璧山采集", "推荐：「烟谜主」周边采集", "尘歌壶种植", "前往采集"]
description = "在黑暗中微微发出光芒的菌类，因为形似暝视龙的角冠而被称为角菌。"

[[materials]]
name = "稀光遗骼"
slug = "glowingremains"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["40级以上蕴光异兽掉落", "星尘兑换", "占位-可合成数量:{0}"]
description = "自蕴光的魔兽体表，取下的散发微光的骨块。\n仍然残留一部分古老月之力的外骨遗骸，在其中能看到因月之力浸润已久，即使已脱离了本体许久仍无法褪去的深邃颜色。"

[[materials]]
name = "珍珠纪行·初稿"
slug = "gnostichymnoldnotes"
rarity = 5
category = "CONSUME"
category_text = "功能开启凭证"
sources = []
description = "用纪行文体写成的游记，记载了在大陆上旅行的种种见闻。不知道为什么会有这个初稿，难道你之前来过？\n\n使用后可以获得当期的珍珠纪行使用资格。"

[[materials]]
name = "远海夷地的金枝"
slug = "goldenbranchofadistantsea"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n「海祇」之名所背负的含义，归根到底只是曾栖身在深海中的弃民，对引领他们的蛇神一厢情愿的期许罢了。\n也正是因为有了仰望自己的子民，所以蛇神不得不留在本应逃离的世界里，折下身上的珊瑚枝，向自己不应涉足的土地入侵，与自己无法抗衡的敌手战斗，直到神体与山丘一同被斩断；直到鲜血化为电浆；直到思念与力量沦为永远无法消散的「祟神」。"

[[materials]]
name = "金蕨"
slug = "goldenfern"
rarity = 0
category = "EXCHANGE"
category_text = "至冬区域特产"
sources = ["推荐：焰羽谷采集", "推荐：曙光车站附近采集", "尘歌壶种植", "前往采集"]
description = "边缘微微发出金光的蕨草，据说经过炖煮后，将会拥有非常奇妙的风味。"

[[materials]]
name = "无垢之海的金杯"
slug = "goldengobletofthepristinesea"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n沉没之城的僭主弹奏黄金乐章的最后一曲时，深受宠渥的乐师窃走了满盛灵露的金杯。\n为神王的背叛愚行所震惊，乐师召集了最后的禁卫，用不溶的灵露将魔龙封印于高塔之下，同王城一起沉沦海渊。\n后来，这高贵窃贼的身影从历史上默默消湮，只有「金色剧团」仍忠诚地记得他的预言。"

[[materials]]
name = "金赤假龙"
slug = "goldenkoi"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "被传为龙之后裔的大型鱼类。\n额上长角，体表无鳞，有金赤战袍加身，有水中王者风姿。实际就血统与习性而论，它们与龙之间的距离差之千里——既无呼风唤雨之能，又无雄踞一方之技，甚至由于性格过于软弱，还常被其他掠食性鱼类抢夺食物，实在愧对这一副威风凛凛的好相貌。因此只能摘下「龙裔」之称，屈居「假龙」之号。"

[[materials]]
name = "攫金鸦印"
slug = "goldenraveninsignia"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["60级以上盗宝团掉落", "星尘兑换：兑换后合成", "占位-可合成数量:{0}"]
description = "象征着盗宝团唯一的原则与傲骨的徽印。只要广袤的大地上、幽邃的深渊里、未知的海洋中仍有待发掘的秘宝，那么手段不论地征服宝藏的盗宝之魂，就永远不会熄灭。"

[[materials]]
name = "金色弦丝"
slug = "goldenstrings"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "精炼材料"
sources = []
description = "「天光的纺琴」专用的精炼道具。\n在早已失落的古代文明中，曾有人认为主宰世界的命运就像舞台上的唱段，是由高天之上一架巨大的竖琴编制而成。或许是因为他们曾亲眼见过天使从天光中抽出金色的琴弦，在宏伟的乐声中宣告命运的无情。"

[[materials]]
name = "谧林涓露的金符"
slug = "goldentalismanoftheforestdew"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n「为人只有三物值得相顾：怀抱月光的泉水、生命的绿色，与不老的容颜…」\n「智慧」的本质并不在于掌控一切思维，谋取一切利益，而在于其能够令平凡的生命最终也获得超越桎梏的自由。\n尽管密林中不再回荡着摄人心魄的虎啸，坚强的卫士也退隐孩童的梦中…在秘密的黄金封印都被揭开，所有的梦想在月光下如琥珀闪闪发亮的那一夜，或许她与她所深爱的凡人们将会赢得真正的自由。"

[[materials]]
name = "鎏金与青宝石"
slug = "goldgildandemerald"
rarity = 0
category = "CONSUME"
category_text = ""
sources = []
description = "金色框体与青色宝石外形的瓶体配饰，「宝石」由玻璃制成，兼顾了美观与成本…"

[[materials]]
name = "秘刻金纹的源核"
slug = "goldinscribedsecretsourcecore"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["30级以上秘源机兵·构型械掉落"]
description = "在击败秘源机兵·构型械后，从其失去动力而解离的躯体中寻找到的核心构件。\n据说驱使所有现在被称为秘源机兵的造物的核心都是同一种，只是不同核心携带的信息并不一样，其上金色纹路图案的差别或许也可以说明这一点。起初只是为了让工具能够自如运转而在回路之中加入了诸多命令，或许正是这种命令的重重叠加，最后造就了人造智慧的雏形吧。"

[[materials]]
name = "华丽宝石瓶"
slug = "gorgeousgembottle"
rarity = 0
category = "CONSUME"
category_text = ""
sources = []
description = "窄口宽体的药剂瓶体，大量直线交织的外观如同一颗大型宝石，可以给顾客格外华丽的观感…\n可以略微提升药剂的品质，所有特殊瓶体提供的增益效果相同。"

[[materials]]
name = "颗粒果"
slug = "grainfruit"
rarity = 0
category = "EXCHANGE"
category_text = "食材"
sources = ["野外采集"]
description = "因穗轴上长出巨大颗粒果实而得到此名的作物。"

[[materials]]
name = "漆黑陨铁的一粒"
slug = "grainofaerosiderite"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["璃月纪念品商店兑换", "礼包商城兑换"]
description = "赋予武器突破之力的材料。\n曾经在璃月云来海之外落下过一个漆黑陨铁，据说也是为了降伏魔兽妖物。但是因为沾染了强大的污秽之血，这块材料的特性已经不再是纯粹的岩王帝君之力了。"

[[materials]]
name = "翠青曜石断片"
slug = "greenobsidianfragment"
rarity = 4
category = "CONSUME"
category_text = "消耗品"
sources = ["踞石山、万火之瓯探索奖励"]
description = "在探索时偶然得到的，刻画有「悬木人」风格纹饰的黑曜石断片。看上去只要有如是三个就能够组成一个完整的环，但不知道有什么作用。"

[[materials]]
name = "翠青曜石环"
slug = "greenobsidianring"
rarity = 5
category = "CONSUME"
category_text = "冒险道具"
sources = []
description = "刻画有「悬木人」风格纹饰的黑曜石环，是部族与深沉夜晚建立联系所用的古老媒介，或许可以凭借它的力量跨越某处的边界…"

[[materials]]
name = "青浪翻车鲀"
slug = "greenwavesunfish"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "体型扁平的中型鱼类，性格温吞，被认为是纳塔各水域中最不易怒的生物。什么都能往肚里塞的饮食习惯使得它们成为了天然的水域清理者，在民间广受好评。\n据传，许久以前，青浪翻车鲀曾在营养物质过度富集，以至于水体表面漂浮着厚重藻类的水域出没，抑制了藻类的过度繁衍。如今「流泉之众」一带的明彻湛蓝的水质，或许也有它们的几分功劳。"

[[materials]]
name = "「诤言」的指引"
slug = "guidetoadmonition"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n「诤言」是智慧之国的枝干。\n诤言相伴巧妙的思虑。多思多虑方能出言谦逊明晰，令智者折服，使愚者醒悟，让智慧如川流一般畅通不息。"

[[materials]]
name = "「诗文」的指引"
slug = "guidetoballad"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n风之国土的灵魂是诗文。\n诗文是激励的心意。在黯淡的日子里，穿过巷道的风中低语着愤怒的诗文，如同战鼓，如同风暴前的低鸣。"

[[materials]]
name = "「慈爱」的指引"
slug = "guidetocharity"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n「慈爱」是冰之国土的救赎。\n慈爱孕育对他人的怜悯。在风雪的国度里，谁若真心为灵魂的罪责悔过，便能得到以慈爱为名的宽恕。"

[[materials]]
name = "「纷争」的指引"
slug = "guidetoconflict"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n火之国土的事理是纷争。\n纷争永远能够被更高层面的力量介入并解决，而非不可收拾，这让一切都得以进入可控的境地。纷争亦是一种局限，禁止不计成本地推诿下去，而是要求参与方更干净利落地得出结果。"

[[materials]]
name = "「角逐」的指引"
slug = "guidetocontention"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n火之国土的原则是角逐。\n人无法与有翼的兽比较飞行的速度，无法与史莱姆比较身躯的柔软，但人自有卓然之处。有时，为何要进行角逐，如何进行角逐，正是认清自己的关键。"

[[materials]]
name = "「勤劳」的指引"
slug = "guidetodiligence"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n岩之国土的根基是勤劳。\n勤劳是流传在璃月人血脉中的催化剂，能将岩石化为黄金，是伟大商港之所以为伟大商港的原因。"

[[materials]]
name = "「风雅」的指引"
slug = "guidetoelegance"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n雷之国土的姿容是风雅。\n风雅是不倨傲。风雅之人永远是谦虚的。只有消除虚荣与怠慢，才能明亮双眼，从哪怕最不堪入目的表象之下寻求美与雅致的真境。"

[[materials]]
name = "「乐园」的指引"
slug = "guidetoelysium"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n「乐园」是月下之地的狂想。\n在满溢着苦涩与悲泣的大地上，创造出没有界限亦没有差别的乐园。虽说这不过是孩子气的妄想，但那同样也是创造未来的基石。"

[[materials]]
name = "「公平」的指引"
slug = "guidetoequity"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n水之国土的堤岸是公平。\n公平是枫丹立国的基础。公平形成了律法的准绳。假若律法失去公平的本质，必沦为敛利的棋盘。"

[[materials]]
name = "「坚忍」的指引"
slug = "guidetofortitude"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n「坚忍」是冰之国土的品格。\n坚忍带来生长的意志。即便寒潮摧折，羸弱的种子仍能借这意志破土而出，在风雪覆盖的大地上生出新芽。"

[[materials]]
name = "「自由」的指引"
slug = "guidetofreedom"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n风之国土的精神是自由。\n自由其二，是漫游的自由，即是能在苍翠的土地上自由地通行，而不受阻挠的自由。"

[[materials]]
name = "「荣光」的指引"
slug = "guidetoglory"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n「荣光」是冰之国土的信仰。\n荣光是长夜中闪烁的火苗，跋涉于雪原上的众人始终注视着它的方向，如同确信风雪将息，黎明将至，他们确信自己仍行在应行的路上。"

[[materials]]
name = "「黄金」的指引"
slug = "guidetogold"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n岩之国土的象征是黄金。\n黄金意味着转换，这是璃月的岩山、大地、港城与人们的默契。在璃月，勤劳被转换为黄金，而黄金被转换为繁荣。"

[[materials]]
name = "「巧思」的指引"
slug = "guidetoingenuity"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n「巧思」是智慧之国的叶脉。\n巧思引导正直的言语。巧妙而周密的向善思索，令出口之言不偏离福祉之正道；怠慢与歹意则令言行卑劣不堪。"

[[materials]]
name = "「正义」的指引"
slug = "guidetojustice"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n水之国土的利剑是正义。\n枫丹的律法秉正义之剑而行。正义必定是盲目的，以正义为利剑者，不论利益或私情都无法蛊惑。"

[[materials]]
name = "「焚燔」的指引"
slug = "guidetokindling"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n火之国土的成规是焚燔。\n想要取得多少的东西，就要付出相应量级的代价。有时为了得到而付出太多，有时却付出的不足而无法得到。能够认识如何正确的付出与得到，也是焚燔的意义之一。"

[[materials]]
name = "「天光」的指引"
slug = "guidetolight"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n雷之国土的愿望是天光。\n即使晖光被重重雷云所掩盖，鸣神的国土之上，依旧有志士如云雀般突破雷光与天之怒海，追寻天光之迹，哪怕迎来冷酷的殛灭。"

[[materials]]
name = "「月光」的指引"
slug = "guidetomoonlight"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n「月光」是月下之地的祝福。\n云中之月的光芒，相对于幽暗无垠的荒野是如此微弱，然而在漫漫长夜中，引导人们前行的却总是那一缕微光。"

[[materials]]
name = "「秩序」的指引"
slug = "guidetoorder"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n水之国土的坚盾是秩序。\n枫丹的一切律法终究服务于稳固的秩序。若无秩序的保证，正义也将沦为无止境的暴力，成为一切人反对一切人的武器。"

[[materials]]
name = "「笃行」的指引"
slug = "guidetopraxis"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n「笃行」是智慧之国的根系。\n笃行印证直率的言说。所思所行皆是为善，仍不可称之为智慧。智慧孕育于行动之中，为正直的言语篆下封印。"

[[materials]]
name = "「繁荣」的指引"
slug = "guidetoprosperity"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n岩之国土的追求是繁荣。\n繁荣是璃月对它的子女的许诺：以繁荣回报勤劳者，以黄金照亮这片土地。"

[[materials]]
name = "「抗争」的指引"
slug = "guidetoresistance"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n风之国土的脊梁是抗争。\n蒙德的历史即是抗争的历史。抗争是为了蒙德现在的人们能够拥有自由，正如风之神吹散冰雪，正如温妮莎奋起抗争。"

[[materials]]
name = "「浮世」的指引"
slug = "guidetotransience"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n雷之国土的梦想是浮世。\n浮世之难求乃是人之美的价值所在。人之在世岂不与雷影相似？意欲追逐掇取则遥踞云端，灯火阑珊的静谧之时却不期而来。"

[[materials]]
name = "「浪迹」的指引"
slug = "guidetovagrancy"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n「浪迹」是月下之地的生活。\n生命与流浪本身并无差别，无人在世间永远驻留，不过是暂作停歇。值得纪念的不是抵达终点的时刻，而是沿途留下的足迹。"

[[materials]]
name = "翡玉斧枪鱼"
slug = "halcyonjadeaxemarlin"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "形貌独特的鱼类，是蝶鱼的须弥远亲。这种鱼类的骨架宽大，身形曲线独具一格。相传最早钓上这种鱼的鱼师将钓竿斜放在尾鳍末端，发现两者结合后形如某种长柄武器，为其取名「斧枪鱼」。相比它的学名「锚钩蝶」，这个名字更为形象，因而在民间广为流传。\n色泽如翡玉的斧枪鱼喜欢在水生植物茂盛的区域活动，身形极易与背景相融，若隐若现。穿行在水草间的小鱼常常撞上它们屏障般的身体，晕头转向，不过翡玉斧枪鱼也不会被激怒，反而会适时为这些邻居提供庇护。"

