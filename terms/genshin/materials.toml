[[materials]]
name = "绿洲花园的恩惠"
slug = "oasisgardenskindness"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n在被黄沙掩埋的古老文献中，花的王者是梦的女主人。\n她曾为被放逐之人、癫狂之人与痴愚之人展现梦想，在梦想中为他们奉上甘美的欢乐，即使人们的手中只有黑铁的碗砵，依旧为花之女王的魅力所折服，深醉于她美丽的形象与无微不至的关怀之中。"

[[materials]]
name = "绿洲花园的哀思"
slug = "oasisgardensmourning"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n花的王者曾与镇灵为善。\n鲜花与绿洲的女主人曾与沙漠的王共同为镇灵建起了「圆形剧场之城」阿伊·哈努姆，在古老镇灵的语言中乃是「月女城」之意。\n但后来，据说花的女王死于烈日与黄沙的恶意，绿洲也不复有紫红的帕蒂沙兰盛开。\n在她陨落之后，沙暴哀鸣、镇灵恸哭，月光般白银的宝石圆盘亦失却了原本的享乐用途，散发出哀伤的光芒。"

[[materials]]
name = "绿洲花园的追忆"
slug = "oasisgardensreminiscence"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["礼包商城兑换"]
description = "赋予武器突破之力的材料。\n人们曾说，花的王者是欢乐与幸福之主。清泉从她的袖口涌流而出，沙漠中便有了百花盛开的绿洲；鲜花与香草紧随着她的脚步，银白的月光为她开道。\n在高天转过脸去的艰苦时代里，花的女主人为凡人遍洒恩惠，人们开始重新认识到快乐与自我，于是再度拾起了闲暇与奢侈。"

[[materials]]
name = "绿洲花园的真谛"
slug = "oasisgardenstruth"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n「何人会敬奉已死的神祇？」\n花的王者曾与彼时的两位神王结成同盟，在智慧与威权之外，她为蒙昧的子民带来了慈悲与欢乐。\n正如大地不能只有烈日和雨水那般，理性与强力之下，欢乐与爱、歌声与乐曲、酒与奢侈同样重要。\n人们说，鲜花盛开的目的即是灿烂的死亡，而死亡正是花之主人从最开始便尽力追寻的终焉——因为死亡为失去的欢乐增添苦涩的风味，让它愈发浓烈地在无穷回忆之中显现。\n黄沙的无知之王从未明晓她的道理，仅仅迷醉于她无穷的魅力与柔情——执着的追忆尽管妄入歧途，却也在花之女王的计算之中。"

[[materials]]
name = "终北遗嗣的祷献"
slug = "oblationofthefarnorthscions"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n银白如清辉的锋刃是恩主的慈恻。\n以仁慈之名，众生皆得以向明日献上希望。即便是未能「完成」的残次品，肤下流淌的亦是月光无垢的祝福。即便是微不足道的祝福，铢积寸累，亦能让浸入其中的圣嗣更接近终将到来的「乐园」。\n一切罪愆与凶慝最终都会被无瑕的月光洗净，因此一切泪水与苦厄皆为必要的牺牲——至少崇月的人们曾如此坚信不疑。"

[[materials]]
name = "明目之油膏"
slug = "ointmentofsight"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "精炼材料"
sources = []
description = "「证誓之明瞳」专用的精炼道具。\n由特殊的深海鳗鳗精炼出的鱼油，曾经被拿来保养渊下宫的神器，使其灼目长明。"

[[materials]]
name = "烈日威权的旧日"
slug = "oldendaysofscorchingmight"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n愚痴的黄沙之王统治的年代里，烈日般黄金的权力遍洒大地。\n古旧的石碑记录，王的威权化作七道烈光或七座柱梁；王的慈悲平均地赐予每一个人手中，没有人受到忽视，亦没有人心怀不满。\n那是一个被遗忘的黄金时代，彼时花的女王已谢落尘沙，草木的主人也决定离去。但只有黄沙的子嗣选择与他们的神祇同在，即使灾祸的阴影渐行渐近，他们所信赖的威权依旧如琥珀与黄金那般闪耀着不灭的光芒。\n但灾祸终究还是降临了，黄金的虫印也被葬在了神殿与宫阙深处、曾雕着鹫兽与牛头的破碎柱基之下。"

