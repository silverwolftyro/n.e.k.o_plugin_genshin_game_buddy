sources = ["野外采集", "推荐：枫丹野外砍伐", "洞天百宝·木材购买获取", "木材转化"]
description = "产自「炬树」的木材，质地较软，易于切削，保持干燥的能力较强，与许多色泽亮丽的涂料相性极好，因此常被工匠们制作成各种精美的装饰品。\n可用于制作摆设。"

[[materials]]
name = "「图比昂装置」"
slug = "tourbillondevice"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["30级以上实验性场力发生装置掉落"]
description = "实验性场力发生装置的核心部件。\n能够在肉眼几乎无法捕获的高速旋转中，抵消重力影响的精密加工机械件。\n在长久的历史中，枫丹动能工程科学研究院一直在以曾经洗去无数生命，又总有一天会再度遮天蔽日的洪水为敌，寻找着生存的途径。\n而蕴含着庞大能量，能够粉碎大地桎梏的始基矿则一度被认为是开启救赎大门的钥匙。"

[[materials]]
name = "宁静水湾瓶"
slug = "tranquilbaybottle"
rarity = 0
category = "CONSUME"
category_text = ""
sources = []
description = "设计巧妙的药剂瓶体，采用了长瓶颈的独特设计，据说这种瓶型被设计师比作「宁静的水湾」…\n可以略微提升药剂的品质，所有特殊瓶体提供的增益效果相同。"

[[materials]]
name = "异海之块"
slug = "transoceanicchunk"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["40级以上原海异种掉落", "星尘兑换", "占位-可合成数量:{0}"]
description = "击败原海异种后，从其体内取得的结晶体。\n散发着些微神秘的能量。\n尽管传说在航道与人迹所不及的远海中存在着伟大的生命，但寻常的海洋不过乏善可陈，生命力远远不及枫丹的「海」。"

[[materials]]
name = "异海凝珠"
slug = "transoceanicpearl"
rarity = 1
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["原海异种掉落", "星尘兑换"]
description = "击败原海异种后，从其体内取得的细小晶体。\n原海异种依托枫丹的「海」而生，推测是因为水中奇异的能量而形成独特形态的生命体。"

[[materials]]
name = "何人所珍藏之花"
slug = "treasuredflower"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["40级以上丘丘游侠掉落", "星尘兑换", "占位-可合成数量:{0}"]
description = "丘丘游侠曾珍视的野花，并不具有什么特别之处。\n花朵在许多文明当中都是表达心意的赠礼或谢礼。"

[[materials]]
name = "寻宝鸦印"
slug = "treasurehoarderinsignia"
rarity = 1
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["盗宝团掉落", "星尘兑换"]
description = "骄傲地标识着盗宝团身份的印记，描绘着他们对宝藏永无止境的追求。话虽如此，盗贼的身份真的需要骄傲地展示吗…？"

[[materials]]
name = "镶边红绸"
slug = "trimmedredsilk"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["40级以上镀金旅团掉落", "星尘兑换", "占位-可合成数量:{0}"]
description = "镶有简单装饰的红色绸缎。\n老练的战士能够从对手眼神中的破绽，找到先机。镀金旅团早已失去了可效忠的主，能够相信的只有自己。据说，他们坚信万物皆会背叛，连自己的双眼也不例外。"

[[materials]]
name = "万相石"
slug = "trishiraite"
rarity = 0
