rarity = 3
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n后来，草木的主人教会了人们锻造黑铁的奥秘。就这样，天真的凡人学会了使用火与利刃的知识。\n草木的主人为之欢欣，纵使火与金属会伤害她，但亦会使凡人强大。"

[[materials]]
name = "远海夷地的琼枝"
slug = "jadebranchofadistantsea"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n失去了一切、逃向暗之外海的魔神在海渊中，见到了什么都没有的弃民。于是它决定留下来，成为他们的「远吕羽氏尊」、「海祇大御神」。\n传说大蛇神曾经折下身上所有的珊瑚枝，让蜷缩在黑暗中的孩子们拥有照亮周遭的光明。又有一说它用折下的珊瑚枝架起了登高的阶梯，让它的孩子们再次回到了地面上，见到阳光。"

[[materials]]
name = "玉玉心羽鲈"
slug = "jadeheartfeatherbass"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "侧面样貌呈心形的奇特鱼类，据说与鲈鱼有着一定的亲缘关系，又因羽毛般细长软骨构成的背鳍和腹鳍，被学者们形象地命名为「心羽鲈」。\n「玉玉心羽鲈」的色泽尤为特别，如同水中的翡玉，因而获得了这一美称。它们有着与安静外貌完全不符的强韧生命力，能在多种特性截然不同的水域存活，而沉玉谷清冽的水质对于它们而言更是无可挑剔，在美玉之名广为流传的沉玉谷，它们生活得无忧无虑，健康安逸。"

[[materials]]
name = "果酱"
slug = "jam"
rarity = 0
category = "EXCHANGE"
category_text = "食材"
sources = ["烹饪加工获得"]
description = "由水果和糖熬制而成的凝胶物质。只要少许就能轻易唤醒疲惫的味蕾。"

[[materials]]
name = "远海夷地的玉枝"
slug = "jeweledbranchofadistantsea"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n这种珊瑚在提瓦特的大地上是见不到的，是大蛇闯入「暗之外海」时，获得的礼赠。因此对于深海的大蛇而言，身负珊瑚枝象征着力量；而失去珊瑚枝时，力量会相应地折损。换言之，折断的珊瑚枝中也蕴含着超常的力量。"

[[materials]]
name = "宝饰的焰剑"
slug = "jeweledflaminghilt"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["60级以上辖域守护者掉落", "星尘兑换：兑换后合成", "占位-可合成数量:{0}"]
description = "辖域守护者所持的焰剑熄灭后遗留下的剑柄。\n发火焰的宝剑是戒谕的象征，依仗「空」之权柄，宣告了绝对且无谬的神意。"

[[materials]]
