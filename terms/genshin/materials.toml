sources = ["元能构装体掉落", "星尘兑换"]
description = "打倒元能构装体后获得的破碎零件。\n这些造型特异的机械是沙漠遗迹永恒的守护者，具有足以凿穿岩山，重塑巨石的力量。驱动这些机械运作的原理与地上、地下许多神秘的机关相似。"

[[materials]]
name = "蒲公英书签"
slug = "dandelionbookmark"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "精炼材料"
sources = []
description = "「无垠蔚蓝之歌」专用的精炼道具。\n在许多诗与故事中，蒲公英都是不受拘束、自在、旅行远方的象征。将蒲公英图案的书签夹在书中从某种意义上而言并不是一种禁锢，反而使它能在比现实更广阔、更光明的世界中遨游。"

[[materials]]
