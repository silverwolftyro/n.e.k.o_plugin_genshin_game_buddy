[[materials]]
name = "沉波蜜桃"
slug = "peachofthedeepwaves"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "体型圆润的中型鱼类，生有犄角般的软骨结构，据说它们会用这一结构开凿水下洞穴，建造栖身之所，或是驱赶试图伤害自己的生物。\n通体粉红，尾鳍嫩绿的角鲀，常让人联想到墩墩桃。鱼如其名，它们的口感确实相当甜美，以至于被鱼师们认定「用来做甜品都不为过」。\n当然，在种种因素的影响下，鱼师们期待的鱼肉甜品并未获得成功。加上这种角鲀较为少见，价格高昂，难以作为食材，人们通常将它作为观赏鱼养殖。\n由于不想花费大笔钱财购买这种角鲀，但又喜爱其明艳色彩的客户基数较大，甚至有商人反其道而行之，当真用墩墩桃制作了这种角鲀的模型，销量还相当不错。"

