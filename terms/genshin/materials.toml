category_text = "角色培养素材"
sources = ["70级以上「仆人」挑战奖励", "合成台-转化页签：转化获取"]
description = "完成与「仆人」的决斗后，在废墟中拾起的晶片。\n已经冷却的血与火依旧维持着羽毛的形状，周围缭绕着凝固的黑色细线。\n心智尚未成熟之时，稚童们总是依赖父母的精心照料，如同雏鸟需要羽翼的庇护。\n为了满足这份愿望，「父亲」将危险的蛛丝织成羽毛，模仿成鸟的翅膀，为家中带去些许温暖。"

