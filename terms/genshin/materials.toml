description = "古老雪精布满裂纹的肩甲。\n在古老时代打造的甲胄本就没法保存那么久，弥补其上逐渐出现的裂隙的，不过是雪精在岁月的磨砺中越发熟稔的臻冰造艺。守护之誓的脆弱亦如这甲胄表面的裂纹，在失去维护者的刹那就会变得显眼起来。"

