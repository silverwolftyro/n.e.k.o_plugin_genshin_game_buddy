category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n「诤言」是智慧之国的枝干。\n诤言终于至善的操行。行为赋予言语真实含义，言、思、行的协同一致，是令智慧之树结出善果的丰厚养分。"

[[materials]]
name = "「诗文」的哲学"
slug = "philosophiesofballad"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n风之国土的灵魂是诗文。\n诗文是传颂的心意。即使一切都将逝去，即使一切都将不再，随风而行的诗歌，仍会将此世间一切美好传遍天空、大地与海洋的一切角落。"

[[materials]]
name = "「慈爱」的哲学"
slug = "philosophiesofcharity"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n「慈爱」是冰之国土的救赎。\n慈爱是对众生的关照，它消弭高低与贵贱，跨越血脉与国别。慈爱的目光往往注视着所有人，它施与不幸者以护佑，并应许众人以永恒的解放。"

[[materials]]
name = "「纷争」的哲学"
slug = "philosophiesofconflict"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n火之国土的事理是纷争。\n纷争的前提是，参与争端的人都会真诚地面对自己的欲望，面对欲望，然后在争辩或战斗之中，才不会忘记自己想要取得的东西，也不会偏离原本的目的。"

[[materials]]
name = "「角逐」的哲学"
slug = "philosophiesofcontention"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n火之国土的原则是角逐。\n角逐是为了让自身更加强大，在一场角逐的胜负落定之后，胜利者从中获得确立自己方向的自信，失败者获得如何变得强大的启示。在胜负之外，这是角逐真正的意义。"

[[materials]]
name = "「勤劳」的哲学"
slug = "philosophiesofdiligence"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n岩之国土的根基是勤劳。\n勤劳即为相信自己，即为相信通过汗水、智慧与力量，在诸神的土地上，人人都可以拥有自己的一席之地。"

[[materials]]
name = "「风雅」的哲学"
slug = "philosophiesofelegance"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n雷之国土的姿容是风雅。\n风雅是不庸俗。风雅之人永远是独行的。不屈于平庸之恶，不感动于平庸之爱，不逃避于平庸的无知，才可能明辨何为雅致与鄙陋。"

[[materials]]
name = "「乐园」的哲学"
slug = "philosophiesofelysium"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n「乐园」是月下之地的狂想。\n乐园的定义因人而异。对那些从不安于现状的人而言，再也没有比挪德卡莱更适合称作乐园的地方了。但对剩下的人来说，情况则恰恰相反。"

[[materials]]
name = "「公平」的哲学"
slug = "philosophiesofequity"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n水之国土的堤岸是公平。\n公平是枫丹立国的基础。公平总是需要稳固的道德与律法加以支撑，道德与律法亦基于不变的公平准则而流变不息。"

[[materials]]
name = "「坚忍」的哲学"
slug = "philosophiesoffortitude"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n「坚忍」是冰之国土的品格。\n坚忍成就生命的繁荣。人们不曾向严寒屈服，如同羸弱的种子偏要在风雪里开出花朵；文明历经困苦而生生不息，如同霜仙花在寒冬中一年又一年盛放。"

[[materials]]
name = "「自由」的哲学"
slug = "philosophiesoffreedom"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n风之国土的精神是自由。\n自由其三，是歌唱的自由，即是能在风之神塑造的美好土地上歌唱，让自己的心与歌一同随风而去的自由。"

[[materials]]
name = "「荣光」的哲学"
slug = "philosophiesofglory"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n「荣光」是冰之国土的信仰。\n荣光是火炬台上不熄的火焰，如今与风雪的国度共存亡。火焰点燃高尚的激情，为了维系它的永恒燃烧，人们甘愿奉献出自己的一切。"

[[materials]]
name = "「黄金」的哲学"
slug = "philosophiesofgold"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n岩之国土的象征是黄金。\n黄金是璃月的财富。但璃月真正的财富，是璃月的人们那如黄金般闪耀的心灵。"

[[materials]]
name = "「巧思」的哲学"
slug = "philosophiesofingenuity"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n「巧思」是智慧之国的叶脉。\n巧思成于谐和的品行。行为赋予思想完美形态，思、言、行的彼此印证，是令智慧之树绽放出花朵的忠实基干。"

[[materials]]
name = "「正义」的哲学"
slug = "philosophiesofjustice"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n水之国土的利剑是正义。\n枫丹的律法秉正义之剑而行。正义意味着裁决与调和，以裁决的剑锋遏止恶行，以调和的手段维护秩序。"

[[materials]]
name = "「焚燔」的哲学"
slug = "philosophiesofkindling"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n火之国土的成规是焚燔。\n所谓的焚燔，是在得到之前，先献出代价，但往往并非一定会有回应与回报。不求回报地付出代价，才是焚燔的真意，因为取得成果的日子终究会到来。"

[[materials]]
name = "「天光」的哲学"
slug = "philosophiesoflight"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n雷之国土的愿望是天光。\n即使永远生活在地下，人也会不屈地祈求天光。人总是追逐超越，无可止步。静止封闭的永恒亦固然壮丽，但其本质终究是死亡。"

[[materials]]
name = "「月光」的哲学"
slug = "philosophiesofmoonlight"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n「月光」是月下之地的祝福。\n于新月初升之时向天空之月祈求启示与祝福，是从初民的时代流传至今的仪式。今夜的月光似乎与过去的每一夜并无不同，但人们曾仰望的那轮新月又在何方？"

[[materials]]
name = "「秩序」的哲学"
slug = "philosophiesoforder"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n水之国土的坚盾是秩序。\n枫丹的一切律法终究服务于稳固的秩序。公平与正义源于秩序，亦服务于秩序。正如枫丹恒无风浪的绵延水面那般，秩序构成了枫丹存在的基石。"

[[materials]]
name = "「笃行」的哲学"
slug = "philosophiesofpraxis"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n「笃行」是智慧之国的根系。\n笃行促生智慧的果实。行为实证行为本身的意义，行、言、思的联结一体，是令贤智之人得见完美的唯一通途。"

[[materials]]
name = "「繁荣」的哲学"
slug = "philosophiesofprosperity"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n岩之国土的追求是繁荣。\n繁荣是璃月的过去、现在与未来。在此世间一切国度都无法企及的繁荣，均归于璃月，以及璃月的子女。"

[[materials]]
name = "「抗争」的哲学"
slug = "philosophiesofresistance"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n风之国土的脊梁是抗争。\n蒙德的历史即是抗争的历史。抗争是为了蒙德未来的诗文，也能自由地随着眷顾的风，传到远方。"

[[materials]]
name = "「浮世」的哲学"
slug = "philosophiesoftransience"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n雷之国土的梦想是浮世。\n浮世之短暂乃是人之美的本性所在。人之在世岂不与稻光相近？神威显现的刹那恍若隽永，而永恒的威鸣又有谁人能够承受？"

[[materials]]
name = "「浪迹」的哲学"
slug = "philosophiesofvagrancy"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["占位-可合成数量:{0}"]
description = "天赋培养素材。\n「浪迹」是月下之地的生活。\n穿越雷霆与风暴，跨过山峦和雪原，即便遍体鳞伤，也绝不就此驻足。浪迹之人之所以还没有停下脚步，是因为他们还没有找到可以称之为「家」的地方。"

[[materials]]
name = "采集用-燃素能量球"
slug = "phlogistonenergyorbforgathering"
rarity = 0
category = "CONSUME"
category_text = "获取燃素"
sources = []
description = "燃素能量球"

[[materials]]
name = "拟似燃素独角鱼"
slug = "phonyphlogistonunihornfish"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "生有独角的奇特鱼类，体型圆润敦实，鱼肚富有弹力，堪比气球。\n其头顶的晶体角状物与固态燃素有着相仿之处，不过据研究，在这种鱼类刚孵化时，其角状物晶莹剔透，如同玻璃，在液态燃素中长期生活，着色物质累积后，才呈现出现有的色泽，获得了「拟似燃素」的戏称。\n每隔几年，独角鱼头顶的「拟似燃素」晶体就会在生长作用下少量崩落，崩落后的碎片是非常珍贵的染色原料，被涂鸦爱好者们视为「火焰的色彩」。"

[[materials]]
name = "漆黑陨铁的一片"
slug = "pieceofaerosiderite"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n璃月之地向来都有海怪的传说，毕竟彼方是超越提瓦特的未知区域了。没有了尘世七神的守护，外面不知道是怎样的一团混沌。能把岩王帝君的力量都染黑的，正是提瓦特秩序之外的力量。"

[[materials]]
name = "松珀香"
slug = "pineamber"
rarity = 0
