description = "用颜色鲜艳的材料制成的飞蝇仿生饵，没有气味，是针对视觉灵敏的大型鱼类的特殊鱼饵，通常会配合更高难度的钓鱼手法。某些地区的钓鱼协会，会把活用飞蝇假饵作为干部晋升标准之一。\n\n适用鱼种：假龙类、炮鲀类、鳐类。"

[[materials]]
name = "蠕虫假饵"
slug = "falsewormbait"
rarity = 2
category = "FISH_BAIT"
category_text = "鱼饵"
sources = ["合成获得"]
description = "以凝液为主料制成的蠕虫仿生饵，会随着水中的暗流扭动身姿，对好奇心旺盛的鱼儿有致命的吸引力。行家还会用融入水果的方法来丰富它的香气，简直无鱼能挡了。\n\n适用鱼种：蝶鱼类。"

[[materials]]
name = "名刀镡"
slug = "famedhandguard"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["60级以上野伏众掉落", "星尘兑换：兑换后合成", "占位-可合成数量:{0}"]
description = "装配在名刀上的华美护具。\n有人坚信刀剑有灵魂、有生命，这也是为什么人们会为刀起名。爱护刀的人，也会得到刀的赏识。但与刀剑成为挚友、甚至爱人的人，须知这份情义是由杀伐浇灌的。常常浴血、与刀共舞之人，他们的热血最终总会被薄情的钢铁冷却。"

[[materials]]
name = "羽状鳍翅"
slug = "featheryfin"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["玄文兽掉落", "星尘兑换"]
description = "击败玄文兽后，从其背上取得的鳍翅残片。\n尽管不具备长距离飞行的能力，这些如同鸟羽一般的鳍翅依然能让玄文兽在驰逐猎物时更为迅疾。"

[[materials]]
name = "发酵果实汁"
slug = "fermentedjuice"
rarity = 0
category = "EXCHANGE"
category_text = "食材"
sources = ["枫丹杂货店购买"]
description = "经发酵而制成的果实汁。带有非同寻常的果实香气，常在烹饪肉类时用于调味。"

[[materials]]
name = "腐殖龙髓"
slug = "festeringdragonmarrow"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "精炼材料"
sources = []
description = "「腐殖之剑」专用的精炼道具。\n将散布在龙脊雪山的地脉当中的，「杜林」的腐毒提纯后得到的物质。用在亲和这种物质的「渴血之剑」上的话，可以提升这把剑的力量。"

[[materials]]
name = "狮牙斗士的枷锁"
slug = "fettersofthedandeliongladiator"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["蒙德纪念品商店兑换", "礼包商城兑换"]
description = "赋予武器突破之力的材料。\n人们总是会对英雄的故事过分夸大啦。甚至是曾经束缚英雄的枷锁，都被升华到了自由之敌的高度。\n因此这些锁链也拥有了非凡的力量。"

[[materials]]
name = "精锻用良矿"
slug = "fineenhancementore"
rarity = 2
category = "WEAPON_EXP_STONE"
category_text = "武器强化素材"
sources = ["锻造获得", "解决事件报酬"]
description = "武器经验素材，含有2000点经验值。\n出于某种原理，武器可以吸收这种特殊的精矿，来变得更强大。"

[[materials]]
name = "牢固的箭簇"
slug = "firmarrowhead"
rarity = 1
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["丘丘射手掉落", "星尘兑换"]
description = "做工粗糙的箭簇。即使如此，也不容小觑：弩是危险的武器，即使贵为骑士，也可能被从后方来的弩矢击倒。"

[[materials]]
name = "杉木"
slug = "firwood"
rarity = 1
category = "WOOD"
category_text = "素材"
sources = ["野外采集", "推荐：坠星山谷砍伐", "推荐：风啸山坡砍伐", "洞天百宝·木材购买获取", "木材转化"]
description = "「冷杉」出产的木材，有着不错的木质和纹理，被广泛使用于各种领域。\n可用于制作摆设。"

[[materials]]
name = "鱼肉"
slug = "fish"
rarity = 0
