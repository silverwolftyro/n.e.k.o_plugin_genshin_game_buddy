rarity = 1
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["愚人众特辖队掉落", "星尘兑换"]
description = "配发给愚人众特辖队的执凭。\n不知持有它的人，怀抱了怎样的决意加入这支队伍。"

[[materials]]
name = "「诤言」的教导"
slug = "teachingsofadmonition"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["礼包商城兑换"]
description = "天赋培养素材。\n「诤言」是智慧之国的枝干。\n诤言出于纯净的心智。唯有清醒纯善的言语，方能表达深秘的智慧，令睿智之种突破傲慢的壅阻，生根繁茂。"

[[materials]]
name = "「诗文」的教导"
slug = "teachingsofballad"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["礼包商城兑换"]
description = "天赋培养素材。\n风之国土的灵魂是诗文。\n诗文是美好的心意。在美好的日子里，吹拂原野的风中飘扬着田园诗、情诗，如和风拨动草叶般拨动人们的心。"

[[materials]]
name = "「慈爱」的教导"
slug = "teachingsofcharity"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["礼包商城兑换"]
description = "天赋培养素材。\n「慈爱」是冰之国土的救赎。\n慈爱是凡人之间的爱护与守望。在广袤的土地上，人们凭此抵御霜雪带来的寒冷，抚平铭刻在记忆里的伤痕。"

[[materials]]
name = "「纷争」的教导"
slug = "teachingsofconflict"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["礼包商城兑换"]
description = "天赋培养素材。\n火之国土的事理是纷争。\n不去避让矛盾，而是直面冲突，在纷争的结果彰显后，根据此结果决定将行的道路。"

[[materials]]
name = "「角逐」的教导"
slug = "teachingsofcontention"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["礼包商城兑换"]
description = "天赋培养素材。\n火之国土的原则是角逐。\n何为强大者，何为弱小者？唯有胜败彰示着一切，角逐的结果，比任何话语更有说服力。"

[[materials]]
name = "「勤劳」的教导"
slug = "teachingsofdiligence"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["礼包商城兑换"]
description = "天赋培养素材。\n岩之国土的根基是勤劳。\n勤劳即为通过人的努力，克服高山与大海，追求繁荣与黄金的勇气与力量。"

[[materials]]
name = "「风雅」的教导"
slug = "teachingsofelegance"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["礼包商城兑换"]
description = "天赋培养素材。\n雷之国土的姿容是风雅。\n风雅是不谄媚。风雅之人永远是高贵的。正似只愿高飞与雷暴争鸣的海鹰；迎合鄙俗则恰如将花冠倒插泥淖，仅让尊严染上了污渍。"

[[materials]]
name = "「乐园」的教导"
slug = "teachingsofelysium"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["礼包商城兑换"]
description = "天赋培养素材。\n「乐园」是月下之地的狂想。\n有人不择手段地想进来，也有人拼了命地想出去。或许乐园就是你永远无法抵达的地方。"

[[materials]]
name = "「公平」的教导"
slug = "teachingsofequity"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["礼包商城兑换"]
description = "天赋培养素材。\n水之国土的堤岸是公平。\n公平限制了权利的边界。若无公平，律法赋予的权利亦会被滥用，成为损害善良风俗的工具。"

[[materials]]
name = "「坚忍」的教导"
slug = "teachingsoffortitude"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["礼包商城兑换"]
description = "天赋培养素材。\n「坚忍」是冰之国土的品格。\n坚忍源自对生存的渴望。就算未被播撒在沃土中，羸弱的种子却也能凭借着这样的渴望，在冻原的土地下根系深扎。"

[[materials]]
name = "「自由」的教导"
slug = "teachingsoffreedom"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["礼包商城兑换"]
description = "天赋培养素材。\n风之国土的精神是自由。\n自由其一，是生存的自由，即是能健全、健康地生活，而不必担心朝不保夕的自由。"

[[materials]]
name = "「荣光」的教导"
slug = "teachingsofglory"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["礼包商城兑换"]
description = "天赋培养素材。\n「荣光」是冰之国土的信仰。\n荣光是深埋于冻土下的火种，若能描摹出它的形貌，也就获得了面对严寒的勇气。"

[[materials]]
name = "「黄金」的教导"
slug = "teachingsofgold"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["礼包商城兑换"]
description = "天赋培养素材。\n岩之国土的象征是黄金。\n黄金是流淌在璃月土地深处的血液，是鼓动璃月的心脏有力搏动的肌肉，是让璃月傲然挺立的筋骨。"

[[materials]]
name = "「巧思」的教导"
slug = "teachingsofingenuity"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["礼包商城兑换"]
description = "天赋培养素材。\n「巧思」是智慧之国的叶脉。\n巧思生自良善的意旨。所谓「毒树不结善果」，良善坚定的意念才能孕育巧妙周到的思谋，方不玷污智慧之名。"

[[materials]]
name = "「正义」的教导"
slug = "teachingsofjustice"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "角色天赋素材"
sources = ["礼包商城兑换"]
description = "天赋培养素材。\n水之国土的利剑是正义。\n枫丹的律法秉正义之剑而行。若无正义的准则，一切律法将沦为无力的空文，任人篡改宰割。"

[[materials]]
name = "「焚燔」的教导"
