slug = "unfadingsilkygrace"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "精炼材料"
sources = []
description = "「饰铁之花」专用的精炼道具。\n「装饰」能够为任何事物附上一份超出其自身价值与功能的小小心意。即便是战斗的工具，在这样的时日，这种不再枯萎的花朵也能为它赋予些许浪漫的内涵。"

[[materials]]
name = "焰中不灭花枝"
slug = "unscorchedblossombranch"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["30级以上不灭衍生造物掉落"]
description = "某人为私心而制造出的合成魔兽，从其身上取下的不会在火中焦枯的花枝。\n在阴沉的炼金术士找到令生命永恒的方法并付诸实践之前，他曾抚摸着被造出来的叶如红羽般的魔兽的躯壳，想象未来某日不灭的合成魔物自火中迎接自己期待许久的朋友的场景。到那时…或许他该折下造物身躯上永生的花作为对方从阴影之域中逃离的贺礼。"

[[materials]]
name = "终北遗嗣的迷顽"
slug = "unyieldingdelusionofthefarnorthscions"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n黄金与白石的大城早已不复，循着月光苍冷的指引，流亡的遗民踏上了阴恶荒寒的异土。\n往日的荣光与神妙的技艺如晨露般枯涸，然而最初的妄执却依然流淌在顽傲者的肌肤下，未曾与衰朽的坟墓一同失却。\n侍奉月光的主祭者们像农人修剪地里的作物那般，世代相继地拣选着最接近原初的纯净血脉，无论要何人为此付出何种代偿…"

