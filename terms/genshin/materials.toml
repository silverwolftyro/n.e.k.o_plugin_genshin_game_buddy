description = "通体浑圆的至冬鱼类，看似与遍布提瓦特的鲀类是远亲，其实分属于截然不同的族系，最早被钓鱼协会记录在案时，代号为「雪国圆鳍鱼」，历经十几代鱼师的变迁，约定俗成的名字演化为「雪圆鳍」。\n奶油雪圆鳍因其色彩近乎纯白与数量稀少，被视为最珍贵的至冬鱼类。传说，但凡栖身的水域水质稍差，其体表都会掺入杂色。还有几则童话将其当成主角，描绘了天才少年鱼师跟着这种雪圆鳍，前往「奶油之国」的梦幻故事，一度导致城内的奶油脱销…"

