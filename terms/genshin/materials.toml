sources = ["70级以上阿佩普的绿洲守望者挑战奖励", "合成台-转化页签：转化获取"]
description = "从阿佩普体内的绿洲中取来的一枚琥珀。其中禁锢着细小的，如今已经绝迹的飞虫。\n包裹着细小生命的琥珀对于树木而言是偶然，对其中的存在而言则是命运。\n随着从天而降的灾厄，树木、藤蔓、根茎与花草纷纷枯干，化作尘埃，许多的生命也消失了。\n但静止在琥珀当中，又被珍藏于这一不存在于地上的绿洲里的无名飞虫，也因此得以前往同族无缘抵达的未来。"

