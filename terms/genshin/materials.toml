description = "从北风的伟大王狼身上，取来的些许凝冰。\n这片大地曾经北风呼啸，呼气凝霜。如砂砾的冰与雪在寒风中嚣叫，飞舞着将肌肤撕裂，让血液凝结。如今的北风王狼力量虽然不如往昔，却仍有能将大地冰封的力量。"

[[materials]]
name = "波波心羽鲈"
slug = "ripplingheartfeatherbass"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "侧面样貌呈心形的奇特鱼类，据说与鲈鱼有着一定的亲缘关系，又因羽毛般细长软骨构成的背鳍和腹鳍，被学者们形象地命名为「心羽鲈」。\n作为心羽鲈中重要的品种之一，波波心羽鲈有着与外貌不符的航渡能力，甚至可以穿行于怒涛之间。据说这种鱼类露出水面，迎着激流游动时，独特的鱼鳍会发出「波波」的声响。单单从蓝色的水体中辨别出具有保护色的这种鱼类，就已经是一大难题了，大部分鱼师尚未亲耳听见这种独特的音色。"

[[materials]]
name = "苍星军势的始动"
slug = "riseofthepalestararmy"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["礼包商城兑换"]
description = "赋予武器突破之力的材料。\n「于整片冻土东方，那如翼之山中诞生的妄自尊大的怪物，不过是贩卖麦芽与矿物的卑劣之徒。」\n「听命于他的风仙不过是长着虫翅的羸弱之众，矮灵们甚至无法用那短小的双臂举起武器。」\n「这群乌合之众的叫嚣又有何人听取，他们又有何等能力阻遏诸位兽王的侵袭？」"

[[materials]]
