[[materials]]
name = "亵渎的新芽"
slug = "profanedsprout"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["70级以上多托雷挑战奖励", "合成台-转化页签：转化获取"]
description = "战胜藏身于世界树中的异端者后，从残毁的地脉深处拾得的枝叶。\n本应象征着希望的新芽，如今已化作亵渎的信标。深罪的树木借由叶脉的延展，正不断向着天空攀升。"

[[materials]]
name = "伪装鲨鲨独角鱼"
slug = "pseudosharkunihornfish"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "生有独角的奇特鱼类，体型圆润敦实，鱼肚富有弹力，堪比气球…其实真的内置了类似气球的浮力舱。\n「拟似燃素独角鱼」能为涂鸦爱好者们带来珍贵的颜料，却又仅能在液态燃素环境中生存，「涂鸦联盟」开始探索在普通水域饲养这种鱼类的可行性。为此，「涂鸦联盟」的上上上任盟主联合纳塔钓鱼协会，斥巨资从枫丹引入了发条鱼类，即「维护机关」的技术，开发了内置数据收集系统的生态模仿机关，进行了一番观察和研究。结果令人遗憾，离开了液态燃素环境后，独角鱼的晶体角状物再也不会焕发出火焰般的光彩，这一计划以失败告终。\n好在，这种机关独角鱼游动时，远看水面以上的部分，就如鲨鱼的背鳍，「流泉之众」向「涂鸦联盟」和纳塔钓鱼协会适量购买了这种「伪装鲨鲨」，用于为冲浪的游客提供刺激而安全的体验，以及在部分水域震慑不法分子。"

[[materials]]
name = "苍砾蕊羽"
slug = "pseudostamens"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["30级以上风蚀沙虫掉落"]
description = "沙虫隐于尾中的苍色鞘翼，仿若绽露的花蕊般纤薄。\n传说在时间开始之前的过去，它们曾在草甸与巨木之下的湿润土地中穿行，如空中飞鸟、水中游鱼。一般认为，花的拟态是为了引诱沙暴中迷途的猎物，但也有说法认为，那盛绽的浮花之形，仿拓的是归于黄沙的，在无数纪元之前的，芳草遍布、繁花依旧盛开的时代。"

[[materials]]
name = "炮鲀"
slug = "pufferfish"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "圆润短小的腹鳍、肥硕敦厚的身躯和老实巴交的脑袋构成了人们对炮鲀的第一印象。这准确地反应了它的大部分个性——呆板、迟钝、缓慢。但少有人知的是，这样的傻瓜外表下却隐藏了一项绝杀秘技——将水流快速吸入身体，然后像炮弹一样从嘴里射出去，精准，强力，即使是渔夫挨上这么一下也免不了七晕八素，是一等一的水中杀手。\n「前有炮鲀出没，小心躲避口水。」——《野钓手册·炮鲀篇》"

[[materials]]
name = "傀儡的悬丝"
slug = "puppetstrings"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["70级以上「正机之神」挑战奖励", "合成台-转化页签：转化获取"]
description = "插入机心人偶背部的导管。流淌其中的色彩时而晦暗时而明艳，矛盾到令人恐惧。\n为机心人偶提供能量，同时也如悬挂木偶的丝线一般控制束缚着人偶。\n失去导管支撑，人偶将羸弱得堪比新生幼儿，寸步难行。"

[[materials]]
