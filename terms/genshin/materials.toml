description = "击败自异界侵入此世的魇语之主，从其留下的残秽中取得的深黯骨骸。\n翱翔于漆黑星海间的无形之兽，本不应需要被这个世界称作「羽翼」的器官。那怪诞而亵渎的翅膀，或许是为了适应月下的法则而生；又或许它不过是凡夫眼中所见的，其真身投下的扭曲一角罢了。"

