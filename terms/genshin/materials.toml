description = "随风而行的细小种子。即使拔去了旅行的羽絮，其中也寄宿着远方的希望吧。"

[[materials]]
name = "夤夜刻像"
slug = "darkstatuette"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["40级以上黑蛇众掉落", "星尘兑换", "占位-可合成数量:{0}"]
description = "刻画着某人形象的独目偶像。\n握在手中时似乎能感受到其中散发的丝丝暖意，就像挚友的臂膀那般。或许能给予明白雕像背后个中含义的人持续前进的勇气吧。"

[[materials]]
name = "擒霞客"
slug = "dawncatcher"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "体表浮现着斑斓霞光的珍稀鳉鱼，看似普通花鳉的变种，但无论是习性还是外观都有不小区别。\n在民间传闻中，这种鱼儿还有预测天气的神异能力。每个晨光刺破天际的时刻，若能见到它们跃出水面、将小小身躯撞入第一缕朝霞，那意味着接下来，人们将会享受到一整日的好晴天。"

[[materials]]
name = "地脉的旧枝"
slug = "deadleylinebranch"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["深渊法师掉落", "星尘兑换"]
description = "来自深邃地底的脆弱枯枝。即使饱经岁月，也能从斑驳的树皮下，看出尚未散尽的力量。"

[[materials]]
name = "地脉的枯叶"
slug = "deadleylineleaves"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["40级以上深渊法师掉落", "星尘兑换", "占位-可合成数量:{0}"]
description = "来自深邃地底的植物枝条。即使远离它的原主，其中也残留着低沉脉动的力量。"

[[materials]]
name = "幽邃刻像"
slug = "deathlystatuette"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["60级以上黑蛇众掉落", "星尘兑换：兑换后合成", "占位-可合成数量:{0}"]
description = "微微散发着不祥的能量的独目刻像，是以何种材质制成则完全不可知。\n凝视着这尊偶像时，似乎能听见令人心情宁静的奇妙低语…\n「看吧，我的孩子。天之座下的万物终将在动荡中消亡。永远宁静的漆黑深空会包容一切。」"

[[materials]]
name = "高塔孤王的残垣"
slug = "debrisofdecarabianscity"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n烈风的魔神「迭卡拉庇安」对自己所造的王城十分满意，他在高塔上接受所有追随者的跪拜。但他却不知道，众人对他俯身并非出于敬仰爱戴。"

[[materials]]
name = "谵妄圣主的朽败"
slug = "deliriousdecadenceofthesacredlord"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["礼包商城兑换"]
description = "赋予武器突破之力的材料。\n据说后来被称为禁城圣主的备受争议的谋主曾一度受到拘禁，而最初的人神，但当时并未具备神体的那位，向他展露了宽阔的胸怀。\n于是原本属于他的族群接纳了他，自他从一度伟大的种族巨大翅膀的阴影中走出之后。\n那以后，他将文有金纹的真容藏在面具之下，决定为那个掌握了他誓言的主人献出一切。"

[[materials]]
name = "谵妄圣主的容光"
slug = "deliriousdemeanorofthesacredlord"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n那是端居在王座的，最初的人神走入了圣火，而凡俗的世界等待着王厅继任者的时代。\n也是谋主代执一切权柄的时代。\n可惜自称圣主的，这位认为他所爱的、他愿意为之垂下金泪的神应该永远只有那一位的僭越者，将私心凌驾于敬爱之神留下的诫言，建立了地天隔绝的城邑。"

[[materials]]
name = "谵妄圣主的余哀"
slug = "deliriousdesolationofthesacredlord"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n在与巨龙进行战争之时，众部族的谋主，那位以面具掩藏起面目者，为部族的战士们解读非人遗迹上金色纹路的信息，那是在现今早已失落的技巧。\n这语言与思想由自己的敌人所授予，或许对谋主来说，站在相对的立场驱使它们是相当快意的复仇之事吧。\n只是他那份毫不掩饰的恨意，偶尔也会换来同行英杰们的深深担忧。"

[[materials]]
name = "谵妄圣主的神面"
slug = "deliriousdivinityofthesacredlord"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n禁城的圣主经常在梦中呓语中叙说非人的语言，并在镜中，面具唯一能露出的眼睛中看到逐渐竖立的瞳孔，而这也是他愈加厌恶龙众的原因。\n传说在赤瞳的少年用火焚烧那被幽影淹没的城上之城时，曾看到王厅前，陷入疯狂的半人如揭下脸皮一般撕下无法脱去的神面，露出犹如巨龙一般的狰狞窍孔。\n癫狂之人口中喷吐的金焰熔化了自己，失形的魂魄自高处沉入了漆黑的泥沼之中，而据说，这就是这位众叛亲离的谵妄者可悲的结局。"

[[materials]]
name = "血斛"
slug = "dendrobium"
rarity = 0
category = "EXCHANGE"
category_text = "稻妻区域特产"
sources = ["推荐：名椎滩采集", "前往采集"]
description = "在诗文中也被称为「赤蕊」的鲜艳植物，一度在稻妻列岛绝迹，如今在战场上再度重现。传说在血腥的战场上，它们开得格外妖艳。"

[[materials]]
name = "散失的草神瞳"
slug = "dendroculus"
rarity = 0
category = "ELEM_CRYSTAL"
category_text = "冒险道具"
sources = []
description = "浓烈的草元素能量积聚成的物质。献给草的神像，能弥补它在漫长岁月中散失的力量。"

[[materials]]
name = "草之印"
slug = "dendrosigil"
rarity = 3
category = "CONSUME"
category_text = "七国徽印"
sources = ["须弥地区探索奖励"]
description = "受到须弥的草木认可，获授的印记。\n可以贡献给森林深处的「梦之树」，以此获得森林的嘉许。"

[[materials]]
name = "否定裁断"
slug = "denialandjudgment"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["70级以上「仆人」挑战奖励", "合成台-转化页签：转化获取"]
description = "完成与「仆人」的决斗后，在废墟中拾起的耳钉。\n红色的符号如同她眼中的图案，既是申敕也是否决。\n失怙失恃的孩子们自幼就蒙受诸般苦难，这些她都记在心底。\n命运审视人间，亦将有人审视命运。"

[[materials]]
name = "空竭的月铁"
slug = "depletedlunariron"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["40级以上先驱秘源统辖阵列掉落", "星尘兑换", "占位-可合成数量:{0}"]
description = "击败游荡于月面的古老机关后，自其内部取得的构件。似乎与提瓦特常见的金属有所不同。\n各国失落的古老民话中，往往有着英雄将空月赐予的「神铁」锻为无坚不摧的兵刃，战胜仇敌或魔怪的传说。只是自空月失坠的金属并非神赐——即便是高居月上的神明，也早在那之前殒落。"

[[materials]]
name = "残毁的横脊"
slug = "desiccatedshell"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["圣骸兽掉落", "星尘兑换"]
description = "圣骸兽脊背上残毁的骨壳。\n昔日遍布四方之土的灾厄之证，如今唯有在人迹罕至之处方能寻得踪影。"

[[materials]]
name = "排异之露"
slug = "dewofrepudiation"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["30级以上无相之水掉落"]
description = "无相之水坍缩后，留下的奇异水珠。\n具有强烈的排异本能，也是无相之水的攻击手段之一。据说水中蕴含着记忆与意志，也能随水体的融合获得成长。然而无相之水唤出的浪潮，与地上地下一切湍流之物皆不相容。哪怕落入佩特莉可那无比纯粹的水中，这滴水也会像水银一般抗拒着周遭的融合吧。"

[[materials]]
name = "黯淡棱镜"
slug = "dismalprism"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["愚人众·冬国仕女掉落", "星尘兑换"]
description = "原本是能偏转光线的棱镜，在流水般的年岁中渐渐变得黯淡。"

[[materials]]
name = "迪芙妲鳐"
slug = "divdaray"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "曾经一度被认为是幻想生物的奇异鳐鱼，只被记录在一些海祇岛的古老画卷中。如今随着尘封的海渊被打开，它们的真实样貌才展现在人们眼前。\n据传这种奇异生物的体色会随着时间的变化而变化，幼年时通常呈现出皦日一般的浅金色。在古画卷的记录中，这个时期的它们被冠以「迪芙妲」之名，其意为「纯真之尾」。"

[[materials]]
name = "孤云寒林的神体"
slug = "divinebodyfromguyun"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n于此躁动、作祟的，正是嗟叹连绵的众神圣骸之体。它们是未能实现的理想，对人类另一种幸福生活的描绘。它们以深海、层岩收纳，却不愿意就此入梦。"

[[materials]]
name = "深潜斗士急流鱼"
slug = "divingrapidfightingfish"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "名中带鱼却不属鱼的中型两栖生物，外形独特，有着拳刃般别致的扁平头部，似乎随时能与天敌激烈战斗。实际上，它们天性温和，并不好斗，这种头部构造只是为了减少在河中游动时的水流阻力。得益于这种头部构造，它们能够破开湍急的逆流，在各个水域自如地穿梭，因而获称「斗士急流鱼」。\n色调偏蓝的斗士急流鱼有着潜入较深水域的能力，不过，由于喜爱阳光直射的温暖感，以及和幼鳍游龙们玩耍的轻松时光，它们不会长时间在水底停留…"

[[materials]]
name = "导能绘卷"
slug = "diviningscroll"
rarity = 1
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["丘丘萨满掉落", "星尘兑换"]
description = "大抵是某种关于魔法的绘卷残篇。隐隐地散发着某种异样的、不祥的温暖。"

[[materials]]
name = "休眠菌核"
slug = "dormantfungalnucleus"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["40级以上活化状态下蕈兽掉落", "40级以上枯焦状态下蕈兽掉落", "星尘兑换", "占位-可合成数量:{0}"]
description = "蕈兽的部分身体组织，在外界元素的剧烈刺激下才会形成。\n生论派的学者们曾对蕈兽究竟属于植物还是动物展开过旷日持久的论战。最后两派达成和解，将蕈兽单列在动植物之外，并不再讨论。"

[[materials]]
name = "琉鳞石"
slug = "dracolite"
rarity = 0
category = "EXCHANGE"
category_text = "纳塔区域特产"
sources = ["推荐：安饶之野采集", "前往采集"]
description = "沉积在富含燃素的区域，逐渐形成的红色鳞状晶石，蕴含极高的热量。"

[[materials]]
name = "龙嗣伪鳍"
slug = "dragonheirsfalsefin"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["30级以上深海龙蜥之群掉落"]
description = "击败深海龙蜥之后，可以拾取到的一截生物组织。\n虽然看起来像是鲨鳍，但其实并不发挥什么作用。\n曾经的白夜国之民对深海龙蜥有深入的研究。它们最为不同的一点就是可以靠意志决定自身特征的去留与遗传。因为厌恶人造光源，龙蜥成年就会失去视觉上的大部分细节；同时为了战斗，它们进化出了其他元素的行为多型性。"

[[materials]]
name = "龙王之冕"
slug = "dragonlordscrown"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["70级以上若陀龙王挑战奖励", "合成台-转化页签：转化获取"]
description = "千年刚玉凝成的结晶之角，乃是「龙王」的天生冠冕。\n注之以精魄，塑之以顽岩。它自山涧而生，在群岩的国土彰示天地的威权，而黄金般的长角则是它在过去与某位君王分庭抗礼的标志。\n曾一度裂折失色，如今却在你的手中闪烁着冰冷的黄金光泽。"

[[materials]]
name = "烈日威权的梦想"
slug = "dreamofscorchingmight"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n白银的月光与碧蓝的清泉，曾装点了绿洲乐园的美景。但随着花的主人谢落在蔽日的沙暴中，无忧的黄金乐园也被死亡所淹没。\n在镀金部族的诗歌中，银白的月光照在猩红的袍裾上，令哀恸之王阿赫玛尔发狂。\n忧伤的沙漠歌谣唱道，出于对旧日回忆的执着，孤独的君王在沙漠中央塑造了无法老去的梦乡。在那里凝聚着不被扰动的纯洁泉水，与永远停留在日暮时分的露光。"

[[materials]]
name = "狮牙斗士的理想"
slug = "dreamofthedandeliongladiator"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n温妮莎从奴役之中得到了自由。结果锁住她的东西越来越大了：从族人变成了整个蒙德，甚至变成了「自由」，乃至这个世界。\n她是发自真心这么希望着的：愿这个世界变得更加坚强一些。"

[[materials]]
name = "异梦溶媒"
slug = "dreamsolvent"
rarity = 4
category = "CONSUME"
category_text = "消耗品"
sources = ["【征讨领域和北风的王狼】挑战奖励"]
description = "能够使追忆与试炼中取得的角色培养素材发生变质，使其变为所需要的形态。\n曾经人们相信灵魂和记忆也是有其质料的。如果曾经有人梦到过天堂，醒来后取出了一朵花，那它应该就是由此构成的。异梦溶媒可以溶解回忆中取得的东西，并且将其变成另一种梦。\n与强者交手的回忆，的确成为了更强之路的砖石。"

[[materials]]
name = "鱼干"
slug = "driedfish"
rarity = 0
category = "EXCHANGE"
category_text = "食材"
sources = ["烹饪加工获得"]
description = ""

[[materials]]
name = "漫行者的晶髓"
slug = "drifterscrystalmarrow"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "精炼材料"
sources = []
description = "「拾慧铸熔」专用的精炼道具。\n看上去只是普通的矿石，在纳塔各地都有出土。但正因为产地的不同，即使是同样的矿石，其石髓亦有细看才能看出的差别——这也是曾经漫行纳塔的旅人收集矿石的原因，有些东西要真切地触碰或握于手中，才可仔细品会其中的不同。"

[[materials]]
name = "浊水的一滴"
slug = "dropoftaintedwater"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["浊水幻灵掉落", "星尘兑换"]
description = "击败浊水幻灵后，取得的一小滴水。\n其中的生命力似乎尚未完全消散。"

[[materials]]
name = "纯圣露滴的滤渣"
slug = "drossofpuresacreddewdrop"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["礼包商城兑换"]
description = "赋予武器突破之力的材料。\n传说在诸生命诞生之前，曾有一片浓稠的原始之海。它曾是万物纯净的起源，也终将吞没一切生命…而那些本不属于原始之海的物质则将被滤除，成为漂荡的浮渣。\n「浮渣亦有它们存在的意义——究竟何种物质会被吞噬一切生命的原始根源之海所排斥？」年轻的调律师曾追随伟大的僭主，思索着这个难题。"

[[materials]]
name = "晚霞翻车鲀"
slug = "dusksunfish"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "体型扁平的中型鱼类，性格温吞，被认为是纳塔各水域中最不易怒的生物。什么都能往肚里塞的饮食习惯使得它们成为了天然的水域清理者，在民间广受好评。\n在一些民间故事中，这种翻车鲀明红与浅蓝交织的色彩，缘于它们「饮下了晚霞的余晖」，而阳光与焰光是纳塔人所爱所敬之物，这个故事在璃月和枫丹的作家们看来，属于「纳塔特有的浪漫」。"

[[materials]]
name = "嬗变之尘"
slug = "dustofazoth"
rarity = 2
category = "CONSUME"
category_text = "消耗品"
sources = ["星尘兑换"]
description = "能够使元素突破材料发生变质，转变其元素属性的道具。\n刨除实用目的的话，炼金术实际上是研讨物质本质与其变化规律的学科，最终通向的是世界运转、地脉流通的规律。\n不知何者出于何种目的，在地上的文明当中散布的这种炼金术的极高成就产物，具有扭转完全惰性化结晶后的元素物质的能力。虽然相当便利实用，但也隐藏着打破平衡的巨大危险性…"

[[materials]]
name = "启圣之尘"
slug = "dustofenlightenment"
rarity = 5
category = "CONSUME"
category_text = "消耗品"
sources = ["「幽境危战」危战嘉奖", "「幽境危战」挑战奖励", "「砺行修远」获取", "挪德卡莱、至冬等地区探索获取", "「珍珠纪行」和「珍珠之歌」获取"]
description = "圣遗物力量的本源来自于故事，因此神圣或渎圣的书写可以尝试重塑圣遗物。\n然而故事本身并无善恶，歌谣与字句既有拯救之力，亦有毁灭之能，正如昔日传谕至圣的启示、统领地上的万国与万国的荣华，却又从高天坠落的使者所相信的那般。时至今日，这些至洁或不洁的翎羽依然能写下虚假的启示，改写注定的故事，然而与世界相抗的结果唯有散落成尘。"

[[materials]]
name = "东风之爪"
slug = "dvalinsclaw"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["70级以上风魔龙挑战奖励", "合成台-转化页签：转化获取"]
description = "从蒙德的东风之主身上，取下的一丝锋锐。\n因为过去撕裂了伟大魔龙「杜林」的血肉的缘故，过去蕴含着骇人的猛毒。但经过你的净化与治愈，其中躁动的毒性终于平息。"

[[materials]]
name = "东风之翎"
slug = "dvalinsplume"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["70级以上风魔龙挑战奖励", "合成台-转化页签：转化获取"]
description = "从蒙德的东风之主身上，取下的一枚翎羽。\n那是经历了千年之风的龙之羽。追求自由的本心使它几乎唤起轻风，好逃离现今的桎梏；但它的旧主对你的赏识，使它留在了你的掌心里。"

[[materials]]
name = "东风的吐息"
slug = "dvalinssigh"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["70级以上风魔龙挑战奖励", "合成台-转化页签：转化获取"]
description = "从蒙德的东风之主唤起的狂风中，采来的些许力量。\n它的身躯是优美而通透的，信风与龙卷都愿为它效力。只要乘风而行，风就是它的同伴、它的歌声与它的自由。\n而它的敌人，就是一千种名字各异的风的敌人。"

[[materials]]
name = "悠古弦音的回响"
slug = "echoofanancientchord"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n神王的宏大乐章由无数曲调连缀而成，但其主调深潜于水国的共同命运之下。\n无虑之年的协和奏鸣曲曾是文明与秩序的最高代表，但当盛世帝国沦为暴君的乐园，横暴者以华丽的黄金大氅为遮掩撕裂着与源泉的联系，不和谐的噪音终于在帝国各处蜂起扰攘之时——\n那最初的命运之曲仍不受骚乱的影响，在黄金日渐褪色的乐谱上持续奏响着…直至一切皆被溶解，一切重回混沌。"

[[materials]]
