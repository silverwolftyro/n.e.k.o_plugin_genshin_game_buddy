[[materials]]
name = "循环式军用月矩核心"
slug = "cyclicmilitarykuuvahkicore"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["30级以上超重型陆巡舰·机动战垒掉落"]
description = "击败超重型陆巡舰·机动战垒之后，自其能源核心中取得的月矩力装置。\n枫丹动能工程科学研究院曾定义过数类元素工质发动机的理想循环模式，无论是哪一种，最为完美的循环数目皆为四。尽管军械宫与帕哈岛试验设计局的工程师们大多倾向于将月矩力视为一种不同于元素力的工质，四循环以外的设计构型依然被证明是低效而不实用的。从某种意义上来说，「四」的循环也许是世界古怪的偏好吧——当然，世界也许并无偏好，对世界而言，自作聪明的凡人擅自猜度的习惯才是最古怪的偏好也说不定。"

