description = "在恶劣的沙漠环境中也能存活的植物所结的果子，赤红的果实在黄沙映衬下显得格外动人。"

[[materials]]
name = "大英雄的经验"
slug = "heroswit"
rarity = 4
category = "EXP_FRUIT"
category_text = "角色经验素材"
sources = ["解决事件报酬", "洞天百宝兑换", "激活启示之花奖励"]
