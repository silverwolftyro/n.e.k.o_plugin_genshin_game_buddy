description = "战胜解放了原本力量的「女士」后，得到的某种蕴含着强大力量的畸形碎片。\n「我做了一个很长的梦。\n「我梦见我与你，在我们缔造的纯白世界中再会。\n「但我终于醒来了。我早已经被烈火吞没。你早已与毒血一同回归大地。\n「不过都无所谓了。要不断往前走，就要烧毁身后的一切，就要相信他所说的永远纯白无瑕的国度，在地平线的尽头，『陛下』的梦中，在他让我看见的『妄念』里。」"

