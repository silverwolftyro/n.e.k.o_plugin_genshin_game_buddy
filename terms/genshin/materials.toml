description = "「香柏树」出产的木材，有着边材较薄，芯材直径较大的优点。虽不如金属般坚实可靠，但需要制作较大面积的部件时，这种木材有着独特的优势。\n可用于制作摆设。"

[[materials]]
name = "空行的虚铃"
slug = "dakasbell"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["70级以上「正机之神」挑战奖励", "合成台-转化页签：转化获取"]
description = "状似铃铛，用来连接机体臂部的球形关节部件。看起来精致小巧，却能负荷远超想象的能量。\n链接手臂，自己的双臂就会失去知觉；\n链接腿部，自己的双腿几乎无法使力；\n而链接这颗机械之颅…\n憎恨与痛苦，疯狂与自傲，都不会被洗去。\n万幸。"

