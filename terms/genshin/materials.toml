sources = ["野外采集", "推荐：纳塔野外砍伐", "洞天百宝·木材购买获取", "木材转化"]
description = "产自「灰灰楼林树」的木材，有着较为轻便的优势，其余性能与大部分纳塔木材相差无几，成年的龙伙伴可以轻松搬运，传说也有部族战士将成捆的灰灰楼林木当成健身器材。\n可用于制作摆设。"

[[materials]]
name = "灰烬之心"
slug = "ashenheart"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["70级以上「女士」挑战奖励", "合成台-转化页签：转化获取"]
description = "战胜解放了原本力量的「女士」后，得到的某种蕴含着强大思念的畸形碎片。\n即使是泪水也无法使火焰熄灭。铁水般炽热的哀伤与愤怒在她的血管中奔涌，从泪腺中迸发。\n在她的心脏被永恒之火烧尽前，最初的愚者找到了她。他明白，只有更加深刻的仇恨与妄执，才能熄灭吞噬她的火焰，让她成为自己的同伴…"

[[materials]]
name = "白梣木"
