sources = ["礼包商城兑换"]
description = "赋予武器突破之力的材料。\n很久很久以前，黄沙的居民以顽强的甲虫为原型雕成王印，用以纪念朝暮轮回的红日与无始无终的时光。\n尽管那位王者的名讳如今已不再被人挂在嘴边，但这些小巧的王印却保留下来，隐约透露着旧日的威名。\n它们随镀金的子孙流散四方，依然沉默地倾诉着旧主的往事。"

