sources = ["推荐：绝云间采集", "推荐：孤云阁采集", "尘歌壶种植", "前往采集"]
description = "只生长在孤高石峰的通透白花。不愿接受平原的温暖与湿润，宁可在清冷的尖峰眺望远方。"

[[materials]]
name = "灭诤草蔓"
slug = "quelledcreeper"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["30级以上无相之草掉落"]
description = "无相之草最终凝聚成的形姿，坚硬的藤蔓包围之下的纯净元素方晶。\n最与常理相悖、又最适宜生命的草元素，与距离一切生命的形态最遥远的无相元素原本不应当相结合出现在大地上吧。一说认为无相元素有「学习」的智性，所以了解到了森林中的多彩与梦。在超越千年的晕染中，也变成了如此的形态。"

[[materials]]
name = "青蜜莓"
slug = "quenepaberry"
rarity = 0
category = "EXCHANGE"
category_text = "纳塔区域特产"
sources = ["推荐：踞石山采集", "推荐：「悬木人」下方采集", "尘歌壶种植", "前往采集"]
description = "青蓝色的，汁液丰富的莓果。其果树大片生长在「悬木人」部族附近，是形态与火榴果相近的植物。"

[[materials]]
name = "漫光的辉角"
slug = "radiantantler"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["30级以上霜夜巡天灵主掉落"]
description = "击败霜夜巡天灵主之后，自其角冠上脱落的碎片，质地轻盈而锋锐，即便是在未经打磨的情况下，也能毫不费力地削开普通的金属护甲。\n古老的民话中，这些高傲而优美的生灵受造于最初的神使。乐园殒落之时，它们曾与霜月的女主人立约，誓要以得赐于霜月的源光，涤净尘世的污秽，直至旧日的恩主再度归来。传说的来由与真实性如今早已无从考证，但过去与光同行的生灵依然在影中庇卫着这片大地——无论是凛冽的长夜还是漆黑的枯潮，都未能使它们的身姿从世间隐匿。"

[[materials]]
name = "繁光躯外骸"
slug = "radiantexoskeleton"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["60级以上蕴光异兽掉落", "星尘兑换：兑换后合成", "占位-可合成数量:{0}"]
description = "自蕴光的魔兽体表，取下的散发着清凉光芒的巨大骨块。\n曾受古老月之力恩赐的魔兽，能够通过这种在漫长岁月中浸入深髓中的光亮，操纵生长而出的外骨，对它们来说，即使并未完全在生理结构上连接，但浮于体表的外骨仍然是可随心念驱使的身躯的一部分吧。"

[[materials]]
name = "辉光棱晶"
slug = "radiantprism"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["60级以上元能构装体掉落", "星尘兑换：兑换后合成", "占位-可合成数量:{0}"]
description = "打倒元能构装体后获得的精巧零件。\n荒漠的王曾经做过一个梦，也做出过许多许诺。\n在荒漠的传说中，这些机械的造物原本是践行诺言的道具，如今也只有它们的机械记忆体中刻写着无人记得的梦与承诺吧。"

