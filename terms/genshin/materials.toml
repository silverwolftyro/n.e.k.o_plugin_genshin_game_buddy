[[materials]]
name = "原初绿洲之初绽"
slug = "primordialgreenbloom"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["70级以上阿佩普的绿洲守望者挑战奖励", "合成台-转化页签：转化获取"]
description = "从阿佩普体内的绿洲中取来的保有古老原始形态的花朵。\n在随后的漫长年月当中，花取得了无穷多的色彩与芬芳，也获得了如夜空中繁星的数量一般多的名字。\n但这朵最初绽放的花始终没有名字。对古老的龙而言，即便玫瑰失去了它的名字，也不会失去它的芳香。定义不过是狭隘短寿的物种用于认识世界的工具；生命是不会为字词所限，永远变化着的。"

[[materials]]
name = "棱光的断尾"
slug = "prismaticseveredtail"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["30级以上蕴光月守宫掉落"]
description = "击败蕴光月守宫之后，其试图逃脱时遗留下的晶化尾椎。\n以常理而言，演化至如此强大的蜥类本不应再受到天敌的威胁，然而它却依旧保留了断尾求生的本能。或许是因为在月光遍照大地的时代，此地曾存在着更加可怕的掠食者吧。"

[[materials]]
name = "坚牢黄玉块"
slug = "prithivatopazchunk"
