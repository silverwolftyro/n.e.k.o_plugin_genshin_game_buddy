description = "钓鱼过程中，若能使张力处于最佳张力区，使用此竿可稳定缩短鱼儿挣扎时间，提高钓鱼成功率。仅挪德卡莱地区生效。\n\n如同凝结的月光般，散发着明净白晖的鱼竿，是挪德卡莱鱼师群体之中，有着至高技法的宗师才有资格持有的杰作。相传，上一位善用这型鱼竿的鱼师仅将钓鱼视作和鱼儿们的「对谈」，会将钓获的鱼儿们就地放生，或是「请回」家中的鱼缸做客几天，就恭送至原本栖息的水域…这等温柔的做法，也在如今的鱼师群体中形成了一个特别的流派…"

