description = "即使在无风的日子里，亦会随雷鸣之声隐隐振动的植物。看起来像是花瓣的结构其实是叶片的延伸，保护着脆弱的花朵。"

[[materials]]
name = "鸣神御灵的亲爱"
slug = "narukamisaffection"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n漫游在荒野中，或是与人一同生活的妖物都会被「雷之三重巴」所代表的御建鸣神主尊所吸引。纵使他们的寿命远远久于万物灵长，也有终结的一日。要在有限的寿命中求得永恒与无限，就只能骥望于「永恒」能记住他们了。而她也回应了他们的愿望，将所有的敌手与友人铭记于心。据说，无论是栖息在迷雾当中、撕裂天空的魔性之枭，胆敢擅闯御苑的怪化狸，还是那位武艺高强容貌如月、最终却对自己露出尖牙的鬼族少女；无论是曾经展开黑翼自在空行的天狗，抑或是与她同行，最终又永远消失的「狐斋宫大人」…\n无数的故事静静地沉睡在她的心中，终有一日会在她所梦想的永恒净土中灼灼发光吧。"

[[materials]]
name = "鸣神御灵的欢喜"
slug = "narukamisjoy"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n在鸣神的幕府中设有奉行之名，乃是诸类事务的管理与执行者。在妖物悠长久远的故事中，在过去，深受将军殿下亲近信赖者会佩戴这种曲勾造型的护符；而奉行之名也取自欢喜奉行之意，得到她青睐的人，也会回报以爱与忠义。而从某一时点开始，一切都不再是原本的模样了。"

[[materials]]
name = "鸣神御灵的勇武"
slug = "narukamisvalor"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n雷电之尊的重宝在于威严，威严由勇武与震怒体现，震怒源于心中的爱执，勇武则是震怒的权现。最终，无论何者，只要敢于挡住望向永恒的目光，只要敢于伤害稻妻的子民，就会成为她的敌人。\n据说御灵有四魂，仙狐有三匹，名刀有二本；而御建鸣神主尊大御所大人的威严之相，只会呈现为流星光底的无想一线。"

[[materials]]
name = "鸣神御灵的明惠"
slug = "narukamiswisdom"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["礼包商城兑换"]
description = "赋予武器突破之力的材料。\n在过去，先民会攀登如今被称为影向山的高峰，将雷电灼烧过的树木雕琢成曲勾形，为照亮高天的闪电、震撼大地的鸣雷赋予造型。这个形象在漫长岁月的积累中，最终演化成了「雷之三重巴」的纹样，象征着雷的眷顾、智慧与威能，以及代行此等眷顾、智慧与威能的人们。"

[[materials]]
name = "鸣川鹈饲"
slug = "narukawaukai"
rarity = 4
category = "FISH_ROD"
category_text = "鱼竿"
sources = ["稻妻钓鱼协会兑换"]
description = "钓鱼过程中，若能使张力处于最佳张力区，使用此竿可稳定缩短鱼儿挣扎时间，提高钓鱼成功率。仅稻妻地区生效。\n\n为纪念古老的鹈饲捕鱼法而制的长竿，竿尖的红宝石象征着鹈匠的火绒，竿身的鸟饰象征着鹈匠的鸬鹚，它们曾指引辛勤的稻妻先辈度过艰难的灾变年代。如今这种生产力低下的捕鱼法基本已被弃用，但那种顽强的开拓精神却伴随此竿一同传承下来。"

[[materials]]
name = "「烟林之真果」"
slug = "naturestruefruit"
rarity = 4
category = "CONSUME"
category_text = "消耗品"
sources = []
description = "蕴含着奇妙香气的果实，是周游壶灵阿嘟从须弥带回的纪念品。\n轻嗅这种果实的香气，脑海中似乎就有某种意象浮现而出。借由「外景之能」，方可在壶中洞天构筑奇妙的须弥景致…"

[[materials]]
name = "虹光凶凶鲨"
slug = "neonmaulershark"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "游弋在挪德卡莱水域的猎手，无比凶悍的肉食鱼！曾经什么都敢往嘴里塞，大口将之嚼碎，但在不少个体误食「月矩力试验设计局」投下的未爆物后，已老实。\n见识到普通凶凶鲨的遭遇后，一些智慧的个体开始学习伪装自身，并通过吞食相对无害的有色食物，演化出如同彩灯招牌般的花纹，如此一来，它们埋伏水下不动时，挪德卡莱的渔师们就会以为它们是水下的垃圾…吗？\n遗憾的是，并不会。彩灯招牌很贵重，一般商家不会轻易将其丢弃…但这些特殊的凶凶鲨反倒因为外表特别，歪打正着，被一些渔师有意保护，总算有了开荤的机会…"

[[materials]]
name = "初生的浊水幻灵"
slug = "newborntaintedhydrophantasm"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["60级以上浊水幻灵掉落", "星尘兑换：兑换后合成", "占位-可合成数量:{0}"]
description = "击散浊水幻灵后，即将再度升起的新生命体，被装在了禁锢的瓶中。\n水中所蕴含着的生命是无形的，而无形的生命也寄于水中，借由水之形诞生。"

[[materials]]
name = "夜色明眼鱼"
slug = "nightgazecrystaleye"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "外形亮眼的鱼类，有着水晶般晶莹剔透的头腔，常出没于挪德卡莱水域。具有深色外表的个体常使人联想到无星的夜空，因此有了「夜色」的美称。\n据研究，这种鱼类的头部充满保护性的液体，主要的双眼位于其中，可以看向各个方位，观察能力卓越。得益于这种身体结构带来的卓越光通量，「夜色明眼鱼」在深水或夜间活动时，相比其他动物，有着更为清晰的视野，能帮助它们及时应对多种威胁…"

[[materials]]
name = "神合秘烟的征兆"
slug = "nightwindsmysticaugury"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n没有固型的灵性依附于物件之上，结合转化为种种不同的面目，这一过程被称为神合，此后，神合后的灵性会在人的恍惚中，向其传达如梦般的图景。\n经常与灵进行这般对话的人需要理解那些图景之中的意义，如解梦般将大地之下的征兆化作部族民众所能理解的语言，或将警示转化为故事。据说这就是部族内被称为「叙事人」的职位的由来，也是大多数杰出的「叙事人」都来自谜烟之内的原因。"

[[materials]]
name = "神合秘烟的思绪"
slug = "nightwindsmysticconsideration"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["礼包商城兑换"]
description = "赋予武器突破之力的材料。\n古时的萨满、祭司或称秘术师的那些，在「大灵」自孤冷英雄与夜魂的呼应之中逐渐形成以来，持续不断地寻找与寂静地下国度沟通的方法。\n入迷，出魂与降神曾是三种主要的途径，而每种途径都将借助打磨的祭具完成。"

[[materials]]
name = "神合秘烟的预感"
slug = "nightwindsmysticpremonition"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n尚古的通灵者认为，没有形象而只有意识的「大灵」是去除了外在，更接近精神本质的存在。\n将粗糙的石料打磨，直至去除所有纹理，成为反射光亮的镜子的过程，也是一种除去世界原有表征的仪式。或许光滑的镜面亦是通灵者自身精神的投射也说不定。"

[[materials]]
name = "神合秘烟的启示"
slug = "nightwindsmysticrevelation"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n正如物质的表征不管如何打磨，其存在本身仍然是物质的，无法超脱于实体。人类的纯粹精神，依托之物既非意向之树，也不是需要勤加拂拭的曜石之镜。在夜晚的国度与夜魂的力量逐渐强大之后，神合之物的范畴也变得逐渐宽泛。后来，无需打磨石镜的仪式，「大灵」借由种种思绪就能向它的崇敬者传达夜神国度的启示，也使得此种祭具最终失去了作用。"

[[materials]]
name = "月莲"
slug = "nilotpalalotus"
rarity = 0
category = "EXCHANGE"
category_text = "须弥区域特产"
sources = ["须弥水域采集", "前往采集"]
description = "生长于林中湿地，散发着同月亮一般皎洁光芒的花卉。只有在夜晚才会绽放。"

[[materials]]
name = "夜泊石"
slug = "noctilucousjade"
rarity = 0
category = "EXCHANGE"
category_text = "璃月区域特产"
sources = ["璃月山洞内采集", "推荐：明蕴镇采集", "前往采集"]
description = "稀有的特质矿石，在静谧的暗夜里会幽幽地发光。据称是天地间奔流的元素在异变中凝聚成的珍奇宝石。"

[[materials]]
name = "宿影花"
slug = "nocturnalblossom"
rarity = 0
category = "EXCHANGE"
category_text = "素材"
sources = ["野外采集"]
description = "双色缠络的花卉，有着极强的月矩力亲和性。由于香调淡雅、色泽显明，时常被认为是优质的天然染料。\n彼此相异的色彩被认为是两种不同的月矩力的象征，因此宿影花有时也会被霜月之子的追随者们视为月之少女的祝福。\n据说五百年前的漆黑灾厄结束后数十年，这种造型奇异的花朵才伴着咏月使的故去出现在大地上。霜月之子的诗歌大多采用这种说法，但这种说法从未得到过严谨的考证。"

