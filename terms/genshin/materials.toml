description = "战胜僭月的伪神后，自异端的试验场内拾得的瓶剂。\n千百年来，自称学者的众愚匍匐在六宗禁制的脚下，他们自欺欺人的研究不过是循环论证的文字游戏。对真理的探求绝不应受到任何限制，如此说来被世人视作异端的恶徒，才是真正的求知者。"

