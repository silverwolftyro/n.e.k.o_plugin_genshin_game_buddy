description = "「究极霸王超级魔剑」专用的精炼道具。\n能够将许多心愿（以及帅气的硬纸板）牢牢地拼合在一起，从而诞生出究极无敌的神奇力量。\n虽说造型差不多（或者说完全一样）的小道具在达莫维百货也买得到，但两者之间其实说不定有着本质上的区别，所以千万不要搞混。"

[[materials]]
