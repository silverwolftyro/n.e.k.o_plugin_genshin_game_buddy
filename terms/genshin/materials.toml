category_text = "冒险道具"
sources = []
description = "如同快乐笑声凝结而成的神奇晶体，呈现出两片书页拼接的姿态，或是自由飞旋的羽毛。触碰之后，便能从中获得「悠乐片段」…\n使用「轻愉信笺」与「欢跃信笺」，似乎能更便捷地确定它们的位置…"

[[materials]]
