sources = ["钓鱼获得"]
description = "活泼好动的小型鳉鱼，以优美的花瓣型鱼尾闻名。\n可能是最爱甜食的一种鳉鱼，身体的每个部分都是一种甜味搜索器，循着甜蜜主义的指引，它们巡游到了提瓦特每条溪流，恪守绝对公正的教旨，对所有甜食一视同仁，绝不因为某些甜味饵料裹挟着鱼钩就将其拒之门外。你肯下饵，它们就肯上钩。\n钓鱼新手友好。"

[[materials]]
name = "「旋流之瓶景」"
slug = "swirlingsceneinabottle"
rarity = 4
category = "CONSUME"
category_text = "消耗品"
sources = []
description = "内部景观优美的生态瓶，是周游壶灵阿嘟从枫丹带回的纪念品。\n凝望瓶内的景致，脑海中似乎就有某种意象浮现而出。借由「外景之能」，方可在壶中洞天构筑奇妙的枫丹景致…"

[[materials]]
name = "并生嵌合胞"
slug = "symbioticchimericnucleus"
rarity = 2
category = "AVATAR_MATERIAL"
