sources = ["钓鱼获得"]
description = "外形亮眼的鱼类，有着水晶般晶莹剔透的头腔，常出没于挪德卡莱水域。具有蓝色外表的个体常使人联想到无云的天空，因此有了「蓝昼」的美称。\n据研究，这种鱼类的头部充满保护性的液体，主要的双眼位于其中，可以看向各个方位，观察能力卓越。但时常有动物误认为，其鱼嘴两侧的结构是闭上的双眼，它们一直在睡觉…"

