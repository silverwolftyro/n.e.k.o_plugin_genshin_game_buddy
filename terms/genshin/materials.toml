category_text = "食材"
sources = ["野外采集"]
description = "明艳而深沉的紫色花卉，散发出使行人驻足的馥郁芬芳。虽然被称作蔷薇但其实严格来说应该算作玫瑰。"

[[materials]]
name = "终北遗嗣的哀荣"
slug = "sunderedgloryofthefarnorthscions"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["礼包商城兑换"]
description = "赋予武器突破之力的材料。\n传说在黄金与白石之国尚未沉沦的年岁，崇月的先民曾在拂晓之星的引导下，筑起直抵天穹的高塔。\n后来，那最为僭越的狂想——即便是统领地上万国的君王也未能成就的、令生命与世界同构的狂想，在高天的震怒中与城邑一同倾覆。\n失乡的幸存者循着霜月的残光逃向南方，在泪中吟咏昔日的哀荣，那已是数千年前的故事了。"

