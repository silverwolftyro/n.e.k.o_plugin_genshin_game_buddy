[[materials]]
name = "海涛斧枪鱼"
slug = "streamingaxemarlin"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "形貌独特的鱼类，是蝶鱼的枫丹远亲。这种鱼类的骨架宽大，身形曲线独具一格。相传最早钓上这种鱼的鱼师将钓竿斜放在尾鳍末端，发现两者结合后形如某种长柄武器，为其取名「斧枪鱼」。相比它的学名「锚钩蝶」，这个名字更为形象，因而在民间广为流传。\n传说，有着「海涛蓝」色泽的斧枪鱼是从须弥水域迁徙至枫丹的特例。相比性格温和的须弥亲属，海涛斧枪鱼的确有着更为坚忍的性格，能在恶劣的环境下长期生存，或是长途跋涉，航程媲美一些商船。因此，也有船员将其视为勇气和耐心的象征。"

