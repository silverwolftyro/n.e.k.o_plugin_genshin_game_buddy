sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n岩枪的核心是发着暗淡光辉的核心，那是战败魔神的力量深入岩石形成的。他们的怨恨并不针对摩拉克斯，因为他们早就已经没有自我了，不可能还残留私怨。"

[[materials]]
name = "烈日威权的余光"
slug = "remnantglowofscorchingmight"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n编织万千思绪，统制万千灵魂，此所谓威权之道。\n然而威权之道并非冷酷的暴政，其目的恰恰最为深郁——创造不再有人苦恼，不再需要迫害与奴役的真实乐土。\n正如沉默的王从晶石的秘密中望见的一切，正如已然消逝的伴侣曾经的教诲那般。\n玄色的虫印与铁色的裁决，就这样成为了王国法度的基石。"

