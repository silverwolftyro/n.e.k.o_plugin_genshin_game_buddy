sources = ["30级以上铁甲熔火帝皇掉落"]
description = "铁甲熔火帝皇的战锤。\n无论是其他的原海异种，还是发条机关或是一时兴起的讨伐者，它用这只巨钳粉碎了无数觐见者。\n与人不同：在原海异种当中，不存在贵族，也不存在富人之子，谁也无法生来就高于别的同类。能够克服一切逆境、战胜一切天敌的原海异种在漫长的岁月中能够随着捕猎与进食，无限地积累力量成长，最终被充满畏惧地称为霸王。"

