[[materials]]
name = "漆黑陨铁的一角"
slug = "bitofaerosiderite"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n提瓦特沿海的诸国把超越七神庇护的外部称之为「暗之外海」，据说许多战败的魔神不愿意活在新的七神秩序之下，于是逃到了远岛，化作了邪神。不过它们的力量和岩王帝君的力量本就同源，和这个吞噬一切的漆黑并不一样。"

[[materials]]
name = "苦炮鲀"
slug = "bitterpufferfish"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "稀有的炮鲀品种，鱼如其名，是在水底世界传播苦涩的家伙。与普通炮鲀相较，它们射出的水炮速度更慢、体积更小，但却因为附着了极具刺激性的苦味信息素而让威力不退反进。在求偶期间，还经常能够见到雄性和雌性之间互相喷射苦味水炮的奇景，或许向彼此传递生命中的苦涩，也是一种爱意的体现吧。"

[[materials]]
name = "黑铜号角"
slug = "blackbronzehorn"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["40级以上丘丘暴徒掉落", "40级以上丘丘王掉落", "星尘兑换", "占位-可合成数量:{0}"]
description = "金属制的魔物号角。通常只能从格外强壮的丘丘人身上获得，因为鸣响号角是需要气力的事情。"

[[materials]]
name = "黑晶号角"
slug = "blackcrystalhorn"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["60级以上丘丘暴徒掉落", "60级以上丘丘王掉落", "星尘兑换：兑换后合成", "占位-可合成数量:{0}"]
description = "隐隐反射着不祥光芒的金属号角，饰有材质不明的黑晶。几乎没有使用过，推测是丘丘人重要的仪式器具。"

[[materials]]
name = "长夜燧火的烈辉"
slug = "blazeoflongnightflint"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n在长夜笼罩边地的年岁里，最初的铸灯者点燃驱散黑暗的明焰，以守望黑潮的重誓换来了特许的御敕，「执灯人」便是这样诞生的。\n与高海的逐影猎人们不同，巡夜的执灯士们既没有失落帝国传承的古老技艺，也没有显荣的封号与头衔，能倚靠的只有银胄下羸弱的血肉之躯、手中的刀剑与灯盏，以及世代背负的古老誓约。\n无论多少魂灵伴着微茫的灯火一同消逝，漆黑的灾厄也无法覆尽凡人的决意。因为长夜能夺去的唯有生命，却夺不去终将到来的黎明。"

[[materials]]
name = "炽铁巨斧鱼"
slug = "blazingaxeheadfish"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "形貌独特的鱼类，与斧枪鱼有着一定的亲缘关系。曾有生物学家调侃，斧枪鱼选择了「斧状下腹」，而巨斧鱼选择了「斧状头壳」。\n背脊如同烙铁般炽红的特殊个体，在挪德卡莱区域极为少见。相传，激怒自然之人乘船漂浮于水波之上时，这种巨斧鱼会悄然出现，用滚烫的背脊划破船体，让恶人沉底溺亡，因此，走运的渔师也会对上钩的「炽铁巨斧鱼」充满敬意，要么将其放生，要么用华丽的鱼缸将其认真供养…"

[[materials]]
name = "烘烘心羽鲈"
slug = "blazingheartfeatherbass"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "侧面样貌呈心形的奇特鱼类，据说与鲈鱼有着一定的亲缘关系，又因羽毛般细长软骨构成的背鳍和腹鳍，被学者们形象地命名为「心羽鲈」。\n得名「烘烘心羽鲈」的这种鱼类有着阳光般独特的色彩，在水中尤为醒目。相传这是一种另辟蹊径的自我保护方法，部分依赖视觉的鱼类会将它们看成「水中燃烧的不明物体」，避而远之。不过，与火热的外表恰恰相反的是，这类心羽鲈的体温较低，摄入的食物又相当之少，有时还会刻意待在浅水区域，晒晒太阳。"

[[materials]]
name = "明燃的棱状壳"
slug = "blazingprismshell"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["60级以上炉壳山鼬掉落", "星尘兑换：兑换后合成", "占位-可合成数量:{0}"]
description = "击败炉壳山鼬后，从其背上取得的完整的背壳碎块。\n据说在一个种群之中，地位越高的炉壳山鼬，其背后蕴藏的燃素会更多，而地位越低越弱的个体，背后蕴藏的燃素越少。形成这个现象的原因也许很好解释：地位越高的炉壳山鼬，需要运用到背后积蓄的燃素的机会或许永远没有地位低的个体那样多吧。"

[[materials]]
name = "贡祭炽心的踌躇"
slug = "blazingsacrificialheartshesitance"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n在原有的文明如破碎的玉石般失落，自天上来，引导地上文明的使者被醒来的巨龙吞噬殆尽之后，步入荒蛮的人失去了重新认识世界的能力。\n于是他们将一切所得都归于最为原始的信仰，认为承载一切的大地自有其神秘，于是，所获的猎物被作为祭品上贡的时代开始了。"

[[materials]]
name = "贡祭炽心的决绝"
slug = "blazingsacrificialheartsresolve"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n据说盗取火种的贤者，在他将掌握各种形态火焰的秘术交给部族的民众之后，曾希望他们得以踏上文明的阶梯，摆脱古老的陋习。\n但传承的迂腐总是难以撼动，而掌握力量的稚童仅仅为了更多的献祭之物就能开启同族之间的战端，这或许也是贤者最后心灰意冷，而从历史中隐去身形的原因。\n值得一说的事是，将生命献祭的仪式遭到全面禁止，却恰恰是禁城的圣主掌权之时。后者为了执掌权威而废弃了种种民俗，却也可视为一类文明的开端。"

[[materials]]
name = "贡祭炽心的荣膺"
slug = "blazingsacrificialheartssplendor"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n「如果你想要拥有世上的一切，那就先将自己的一切献给世界吧。」\n在禁城的圣主不再允许众人向夜晚的国度祈求之后，一度建立的精神的纽带业已荒毁。\n受指引的赤瞳的少年经历种种考验，其最后一项就是要效仿最初的人神那样，用黄金的匕首献上自己的心脏。\n自我的献祭是一种胜者的荣膺，他没有丝毫的犹豫，用烁光的利刃劈开自己的胸膛。而他再次出现的时候，已是从水如流光的国度归来，即将重造伟业的时刻了。"

