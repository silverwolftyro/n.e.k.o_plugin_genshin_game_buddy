slug = "harrafruit"
rarity = 0
category = "EXCHANGE"
category_text = "食材"
sources = ["野外采集"]
description = "生长在炎热潮湿的雨林当中，有着特殊辛香的果实。磨成粉末后可以制成香辛料，是须弥最重要的香料植物。"

[[materials]]
