[[materials]]
name = "雷鸣仙"
slug = "raimeiangelfish"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "生活在稻妻的珍稀蝶鱼，喜好雷元素聚集的水域，似乎能从电流中攫取欢愉。\n相传原本与生活在璃月的「长生仙」源出一脉，直到被旅行商人引入稻妻后，生态上发生了意想不到的变化。就目前而言，已经有学者利用它们与雷史莱姆进行通电研究了。\n「麻...麻...舌陀...麻噜...」——某位贪食了「雷鸣仙」料理的老饕。"

[[materials]]
name = "虹滴晶"
slug = "rainbowdropcrystal"
rarity = 0
category = "EXCHANGE"
category_text = "锻造用矿石"
sources = ["野外采集"]
description = "映着虹色辉芒的晶石，有着优异的韧性与可塑性，自古以来便被至冬的工匠们视为绝佳的锻造材料。\n传说明月的高车破碎时，沾染神血的车軎殒入月下的尘世，化作虹色的宝玉。从那以后，大地上的人们不再为死去的神明奉上信仰，唯有那些知晓夜的君王们为何而死的幸存者们依然在徒劳地歌唱着那些早已被遗忘的名字。"

