description = "以小麦粉为基底的鱼饵，混入了泡泡桔的果肉和桔籽，投入水中后，酸甜的香味会迅速弥漫开来，有效吸引诸如心羽鲈之类的鱼儿。据说，曾有钓鱼佬在野外长期驻守时，耗尽了口粮，食用这类鱼饵应急，并不幸中毒…为防这类事故再次发生，此后制作的这类鱼饵大幅提升了酸度，以至于普通人将鱼饵凑近鼻子边，都会被刺激得头晕流泪，根本不可能将它放入口中…\n\n适用鱼种：心羽鲈类。"

