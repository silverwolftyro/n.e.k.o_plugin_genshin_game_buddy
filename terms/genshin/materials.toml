description = "「银釭」的精炼材料。\n有着初采新茶香气的缨络，深蕴着「万象风角灵官」的灵力。轻拂秘银的剑身时，似能令其再焕锋锐。"

[[materials]]
name = "星与火的基石"
slug = "thecornerstoneofstarsandflames"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["完成纳塔地区任务获得"]
description = "「英雄点燃圣火，照亮世界，又终将沉眠，枕星安息。」\n「他们留下了一块石头，一张织物。我们以此为基石，搭起了永不断绝的文明。」"

[[materials]]
name = "凛雪帝皇的庆仪"
slug = "thefrostemperorsceremony"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n宫廷里的妖精们并不明白为何被献与皇帝的礼物被制造成这样的形状，他们只会一味堆砌如宝珠般的饰品上的工艺。\n唯有王座上的皇帝与冰雪的精灵知晓这饰品背后的含义。\n重要的从来不是仪式，而是仪式中具有的往昔的真意。"

[[materials]]
name = "凛雪帝皇的辞决"
slug = "thefrostemperorsfarewell"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n在战争的前夕，不知何时也不知如何出现在桌上之物。\n他知道那是他久未得见的友人亲手所制。\n天地原如，他在此时才恍然，这就是一切厄难的开端，一切欲望的苦果，一切毁灭的先兆。"

[[materials]]
name = "凛雪帝皇的悲恤"
slug = "thefrostemperorslament"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n在真相如苦水泛起波澜的夜晚，已然不似从前的她为王座之上的友人筹备的礼物。\n两人之间都觉得那应该是他们最后一次如此交谈。\n因为在那以后，他们从前同行的道路就因其中一人的软弱与另一人的愤怒分崩离析。"

[[materials]]
name = "凛雪帝皇的复生"
slug = "thefrostemperorsrevival"
rarity = 2
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["礼包商城兑换"]
description = "赋予武器突破之力的材料。\n自雪原中走出的，尚未成为整个雪原之主的英雄，在那时已展现出总向周围人倾诉太多的习性。\n所以在他获得当时尚未化作人型的冰雪的精灵的礼物时倍感惊讶。\n对于他来说，他从未记得自己向对方诉说过自如翼的山峰之中、似冰雪般的卵中诞生的事，也不曾向对方述说那一日的日期。"

[[materials]]
name = "万劫之真意"
slug = "themeaningofaeons"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["70级以上永恒的守护者挑战奖励", "合成台-转化页签：转化获取"]
description = "在一切尘埃落定之后，从净土带回的小小头饰。\n一念则万劫尽，总有思念可以超越时间。\n百千万劫，「真」实之意，不知道是否传达到了。"

[[materials]]
name = "「凝静的海色」"
slug = "theseassilentshade"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "精炼材料"
sources = []
description = "「苍纹角杯」专用的精炼道具。\n细密温润的彩砂，质地如傍晚的海风般轻柔。\n在梅兹特利的古老传说中，海是群星的归宿，沉落的星芒终将化作苍色的海砂。静静聆听，瓶中摇晃的，正是星光与海潮的絮语。"

[[materials]]
name = "「看得见的风」"
slug = "thevisiblewinds"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "精炼材料"
sources = []
description = "「风花之颂」专用的精炼道具。\n象征着风车与风之花的精致饰物，也是「风花之颂」的弓臂上的装饰品。「风」本身看不见、摸不着，而恒常转动着的风车、绿地上摇摆的花朵则是「看得见的风」，向人们昭示着，轻柔的风无时无刻不眷顾蒙德的大地与众生。"

[[materials]]
name = "藏雷野实"
slug = "thunderclapfruitcore"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["30级以上掣电树掉落"]
description = "被锋锐树叶包裹着的掣电树核心，肆意向周身散发雷元素。\n大地深处咆哮的能量急切地想要倾泻暴怒，于是不幸的藤蔓也沾染了狂躁的气息，挥舞着扭曲的枝条哀号，不知是想要让他人品尝雷火穿身的苦痛，还是挣扎着期待必至的末日。"

[[materials]]
name = "汐藻"
slug = "tidalga"
rarity = 0
category = "EXCHANGE"
category_text = "食材"
sources = ["枫丹水下采集"]
description = "随波逐流的藻类，依靠其他植物释放出的养分维持自身存在。虽然经常会被误解成浮游动物，但本质上其实是浮游植物。"

[[materials]]
