description = "赋予武器突破之力的材料。\n对执掌晶矿采掘与冻土开发的矮灵们的大公来说，在极地开辟一片绿洲不过举手之劳，自他处移种品质更好的黑麦也并非难事。\n于至冬存续到如今的诸多妖灵贵族里，他拥有的地位也显赫到无可比拟。\n但日益隆盛的野心之火顺着喉壁而下，古老妖精的贪欲随着岁月增长，亦无止境。"

