sources = ["野外采集", "推荐：挪德卡莱砍伐", "洞天百宝·木材购买获取", "木材转化"]
description = "产自「榛树」的木材，虽然来源的树种形态多样，但木材表层大多具有独特的成分，防虫防腐能力可观，极为耐用。"

[[materials]]
name = "秘源真芯"
slug = "heartofthesecretsource"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
