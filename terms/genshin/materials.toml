slug = "tomato"
rarity = 0
category = "EXCHANGE"
category_text = "食材"
sources = ["杂货店购买"]
description = "外皮鲜红的草本植物。色泽艳丽，酸甜多汁。关于它到底属于水果还是蔬菜的争论自古有之。"

[[materials]]
name = "炬木"
slug = "torchwood"
rarity = 1
