description = "产自「柽树」的木材，质地特别，能够同时抵抗干旱和潮湿，极耐衰损。\n可用于制作摆设。"

[[materials]]
name = "终北遗嗣的煌熠"
slug = "aureateradianceofthefarnorthscions"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n伴随着预言之子不受祝福的降生，千年的规划迎来了黯然的暮色。\n用尽心机的谋算因背叛的愚行轰然破碎，理应为王的少年带走本该服膺他的侍女，窃取本该属于他的秘宝，却只是将命运为他留存的冠冕悉数否决。\n后来，注定统治乐园的王以罪无可赦的大盗之名沦入历史，而真正的新月照临大地之时，终北之国辉煌如黄金的悲愿，也已经被从未信仰过任何神明的祭司，葬入了她的王空无一物的坟茔。"

