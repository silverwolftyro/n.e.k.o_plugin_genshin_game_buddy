sources = ["矿物类采集物中获取", "幼岩龙蜥、岩龙蜥产出", "丘丘岩盔王产出"]
description = "海灯节期间，用以制作「霄灯」的材料。\n能自行悬浮的神秘元素石片，是霄灯飞往遥远天际线的秘密，传说也是「群玉阁」漂浮的动力来源。"

[[materials]]
name = "久雨莲"
slug = "pluielotus"
rarity = 0
category = "EXCHANGE"
category_text = "素材"
sources = ["河岸湖泊采集"]
description = "生长在水元素富集之处的植物。枫丹漫长的雨季后，随处可见其踪影，因此而得名。"

[[materials]]
name = "净光翎"
slug = "plumeofpurifyinglight"
rarity = 0
category = "CONSUME"
category_text = "消耗品"
sources = []
description = "灵光百种所遗留下来的，凝结着过去记忆的断片。"

[[materials]]
name = "迁风的苍翎"
slug = "plumeofthechangingwinds"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "精炼材料"
sources = []
description = "「风信之锋」专用的精炼道具。\n由松石雕而成的古旧羽翮，在过去似乎曾被用作饰品或信物。"

[[materials]]
name = "堕天的落羽"
slug = "plumeofthefallenwatcher"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["30级以上守望者·堕天掉落"]
description = "击败堕天的守望者后，于尘世一隅拾得的落羽。\n与真正的天之御使相比，拥有羽毛的守望者在形象上似乎与通常意义的天使更为肖似。这或许是因为它们侍奉的造主也并不理解天上有翼者的神圣规划，只能拙劣地摹仿其理念投射出的影子。"

[[materials]]
name = "偏光棱镜"
slug = "polarizingprism"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["60级以上愚人众·冬国仕女掉落", "星尘兑换：兑换后合成", "占位-可合成数量:{0}"]
description = "能够偏转光线的棱镜。\n在黑暗中，棱镜可以将细微的光明散布到更大的范围里。或许也是因为这样的特性，这种棱镜对于内心常常被黑暗笼罩的人，有着令他们稍稍安心的力量。"

[[materials]]
name = "便携轴承"
slug = "portablebearing"
rarity = 0
category = "EXCHANGE"
category_text = "挪德卡莱区域特产"
sources = ["蓝珀湖附近采集", "推荐：叮铃哐啷蛋卷工坊采集", "前往采集"]
description = "愚人众进驻挪德卡莱后大量制造的便携轴承单元。损耗过度的单元也会像失去用途的单位一样被抛弃。\n其中偶尔还会残存一些微弱的月矩力。由于难以仿造，有时也会被那夏镇的商人当作等价交换的凭物。\n也正是因为如此，据说曾经有人试图伪造过这些单元。最终似乎是因为伪造的成本高于它们作为一般等价物的价格而破产了。"

[[materials]]
name = "土豆"
slug = "potato"
rarity = 0
category = "EXCHANGE"
category_text = "食材"
sources = ["杂货店购买"]
description = "块状的草本植物。来自大地的馈赠，是不管怎样加工都永远吃不腻的一味神奇食材。"

[[materials]]
name = "精制机轴"
slug = "precisiondriveshaft"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["60级以上巡陆艇掉落", "星尘兑换：兑换后合成", "占位-可合成数量:{0}"]
description = "由设计局精制的巡陆艇机轴。\n在北国的工程师规划的图纸上，这不起眼的小东西曾经是象征着荣耀与技术进步的完美杰作，无数世代智慧的成果凝结在这小小的金属元件之中。于是它就这样散落在冰冷的泥土中，等待下一次的回收。"

[[materials]]
name = "精密型月矩力冲鸭模具"
slug = "precisionkuuvahkistampingdie"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
sources = ["30级以上重拳出击鸭掉落"]
description = "击败重拳出击鸭之后，从其破损的结构中取得的冲压模具，也可以认为是爱诺赠送的纪念品。\n曾有须弥的哲人在论证中认为，自我繁衍是生命独一无二的特征，任何受造于人的物件都无法实现同等的伟业，因而繁衍的权能正是将神性与人性区分的关键。\n然而，若是给定模具，让机关按照其形状复制连同模具在内的自身，是否也能被视为永生的繁衍呢？陪伴在爱诺身边的那位沉默寡言的蓝发女仆，她过去侍奉的旧主也思考过同样的问题，最终却因为担忧无限自我增殖的机器会耗尽星球地表的一切而作罢。\n不过，这些事情与爱诺向来是没有关系的，这台机器暂时也不会用尽地表的一切来复制自身——毕竟鸭子只是鸭子而已。"

[[materials]]
name = "源生嵌合体"
slug = "primechimericnexus"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "角色与武器培养素材"
sources = ["60级以上异种合成魔兽掉落", "星尘兑换：兑换后合成", "占位-可合成数量:{0}"]
description = "异种合成魔兽体内的核心。\n合成魔兽体内可承受的最为复杂的核心，已是受人工规划却完美的生命之种。将之制造而出的人，或许已理解生命本身被塑造的方式了吧。"

[[materials]]
