sources = ["70级以上蚀灭的源焰之主挑战奖励", "合成台-转化页签：转化获取"]
description = "在与蚀灭的源焰之主战斗后，仍在不息燃烧的环状火焰。\n最初，在最深邃的夜晚里，执掌火焰的主人仿照太阳，以此取代星空的光芒。\n一半的火焰已受侵蚀的焰芒之辉，似乎还能看出映照旧日世界的光采。"

[[materials]]
name = "纯圣露滴的真粹"
slug = "essenceofpuresacreddewdrop"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n浓稠纯净的精粹溶液，由原始无垠之海的水滴中精炼而出。古代的神王曾相信它能带来永恒生命与无穷智慧，然而侧耳细听——它正隐隐预言着溶合为一的终局。\n这曾是神王未完成的宏伟乐章——无根无源的黄金灵露将替代原始莽荒之水，永生智者的辉煌秩序将为所有无知的角落带来甘露般的启蒙。\n但神王的妄想终究沉入深黑的海渊，黄金的灵露也随着无情时光被原始之汤侵蚀…\n调律师却对噩兆视之不见，支撑着残破的身躯，仍旧企图以最后的灵露赋同胞以生命，让旧日的秩序重临…\n如今，在枫丹诸多疯诗人与年轻画家的噩梦中，波爱修斯亲历的末日幻景仍旧时而重现，向他们提醒着难以逃避的轮回。"

