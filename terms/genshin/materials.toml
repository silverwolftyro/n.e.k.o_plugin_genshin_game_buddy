[[materials]]
name = "藏窖灵浆的酩酊"
slug = "intoxicationofthecellaredspiritualnectar"
rarity = 3
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n在别处仅作为食粮丰收的馀庆，对于行于严寒之中的诸氏来说则是生存的必须。\n据说制酒技术最为精湛的矮灵们昔日就曾依靠此术为当时效忠的王者积累宝库中的财富。\n如是，妖精的酿造借由氏族之间的交易，如淌毒的蜜一般流经了整个冻土。"

[[materials]]
name = "虹晶星花鱼"
slug = "iridescentstarbloomfish"
rarity = 3
category = "EXCHANGE"
category_text = "鱼"
sources = ["钓鱼获得"]
description = "游弋在至冬水域的特殊鱼种，从正面观察，六片鱼鳍呈现出近似星星与雪花的形状，因而被最早发现它的鱼师命名为「星花鱼」。其中蓝色亚种的鳞片有着绝佳的质感与色彩，在某些光照下，如同映照彩虹的水晶，因而得到了「虹晶」的雅称。得益于这种闪耀的外观，虹晶星花鱼成为了至冬鱼类收藏家们最珍视的贵客，甚至有人专门为了这种鱼儿搭建昂贵的水箱景观，结果久久无法钓到它们…"

[[materials]]
name = "虹月印磐"
slug = "irismoonseal"
rarity = 4
category = "CONSUME"
category_text = "冒险道具"
sources = ["虚海望探索奖励"]
description = "集齐3个印磐后，可开启虚海望宝库。\n\n在探索时偶然得到的圆形符印，如能找到纹样相同的3个，似乎就能拼凑出曾经照亮世界的皓月的影迹。"

[[materials]]
