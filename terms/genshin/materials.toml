description = "异种合成魔兽体内的核心。\n合成魔兽体内相对复杂的核心，并生的核心意味着将要驱动两种生命的循环，以此构成同一个生物。"

[[materials]]
name = "北风之尾"
slug = "tailofboreas"
rarity = 5
category = "AVATAR_MATERIAL"
category_text = "角色培养素材"
