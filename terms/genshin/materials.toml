description = "战胜僭月的伪神后，自异端的试验场内拾得的面具。\n所谓医疗的目的在于消除躯体上的病症，然而俗世的医者却对真正致死的疾病视而不见。苦弱的血肉之躯，经由贤医之手不再囿于生老病死，展现出超越常理的力量。"

