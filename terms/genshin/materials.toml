rarity = 3
category = "AVATAR_MATERIAL"
category_text = "武器突破素材"
sources = ["占位-可合成数量:{0}"]
description = "赋予武器突破之力的材料。\n「源自原始之海的活物，必将回归同一的命运。」调律师波爱修斯曾如是说，「但人的超越有着无限可能，即使原始的胎海也无法将之消融净尽…」\n傲慢的僭主曾试图调配不溶于纯水的灵露，以之容纳灵智与记忆，令臣民得以抛却肉身，获得永恒独立的生命。\n但灵肉转换的痛苦并非任何凡俗生命能够承受，僭主的律令撕扯着破碎的灵魂…\n灵露被众多魂灵的哭嚎染成黑色，从此其中失却调谐的神智，只余混乱与疯狂。"

