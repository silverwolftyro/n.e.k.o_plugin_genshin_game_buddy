[[materials]]
name = "纺灵之梭"
slug = "shuttleofodara"
rarity = 4
category = "AVATAR_MATERIAL"
category_text = "精炼材料"
sources = []
description = "「厄水之祸」专用的精炼道具。\n如棱镜般折射着奇异光泽的玉石坠饰，即便置于焚火上灼烤，那份萦绕的阴冷依然挥之不去。\n古老的巫术传承中，「梭」本身便象征着穿刺不同界域的媒介。据说在众人尚不知晓怎样数算自己日子、怎样将故事纺成织物的蛮荒年岁，那些流徙于灵火之原的巨龙早已被忘却的语言中，亦将在漆黑死寂的群星间巡行的造物称作「空梭」，哪怕是将一个世界笼罩在内的厚重面纱，也会被流火的梭镖刺破。\n当然，这些说法全部来自狡狯的欺诈师桑哈杰，与他曾经编织出的无数戏言一样，说不定只是用来骗吃骗喝的故事——时至今日，烟谜主一些德高望重的祭司依然抱持着这样的观点。"

