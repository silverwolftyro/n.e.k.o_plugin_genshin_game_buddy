# =============================================================================
# terms/genshin/systems.toml —— 原神 · 机制与系统
# -----------------------------------------------------------------------------
# 不进语境块，按需查询。只写 [terms.*]，不得出现 [game] 表。
#
# 来源说明：miao-plugin 的 meta-gs 索引里没有元素反应/机制这类数据
#   （artifact/data.json 只有套装名与 2/4 件套效果文本），因此本文件是人工撰写。
#   每条都只写「是什么」，不写数值口径；未定的表述以行内 TODO 注记标出。
# =============================================================================

# 人工撰写：这 15 条机制不在 miao-plugin 索引里（索引只有角色/武器/圣遗物表）

[terms."蒸发"]
kind = "机制"
brief = "火元素与水元素反应，按触发顺序提升本次伤害倍率。"
slang = ["打蒸发"]

[terms."融化"]
kind = "机制"
brief = "火元素与冰元素反应，按触发顺序提升本次伤害倍率。"
slang = ["打融化"]

[terms."感电"]
kind = "机制"
brief = "雷元素与水元素反应，造成持续雷元素伤害，对群有效。"
slang = ["打感电"]

[terms."超载"]
kind = "机制"
brief = "火元素与雷元素反应，造成范围火元素伤害并把敌人击退。"

[terms."冻结"]
kind = "机制"
brief = "水元素与冰元素反应，使敌人无法行动。"

[terms."超导"]
kind = "机制"
brief = "冰元素与雷元素反应，造成冰元素伤害并降低敌人物理抗性。"

[terms."扩散"]
kind = "机制"
brief = "风元素接触其他元素后，把该元素扩散到周围的目标。"

[terms."结晶"]
kind = "机制"
brief = "岩元素接触其他元素后，生成可拾取的元素结晶护盾。"

[terms."绽放"]
kind = "机制"
brief = "草元素与水元素反应，生成草原核，引爆后造成范围伤害。"

[terms."激化"]
kind = "机制"
brief = "草元素与雷元素相接触时触发的元素反应。"
# TODO(verify): 超激化／蔓激化的准确表述
# ★ 2026-11-09：机制名「超激化」「蔓激化」已确认是官方反应名；但**伤害倍率与
#   属性抗性增减方向**属数值口径，本工作区无权威出处，故**保留 TODO**。
#   brief 里原写的「提升随后雷／草元素伤害」属未核实口径，已从 brief 移除，
#   只保留可确认的部分（草 × 雷 = 激化）。
verify_note = "待人工校对：超激化／蔓激化的伤害倍率、属性抗性增减方向，以及草原核机制与「激化」的准确关系，需对照官方元素反应表核实"

[terms."圣遗物"]
kind = "机制"
brief = "角色的主要属性来源；每件圣遗物有固定部位与「主词条」，「副词条」在强化时随机提升。"
slang = ["词条", "歪了", "双爆"]
# ★ 2026-11-09：官方机制名已确认——「圣遗物强化」（提升等级）、「主词条」/「副词条」；
#   「歪词条」是**玩家俗语**，指副词条随机到了不想要的属性，不是官方词条名。
#   原校对待办已移除（2026-11-09）：机制名与「歪」的性质均已确认。

[terms."命之座"]
kind = "机制"
brief = "重复获取同一角色后解锁的额外能力层级，官方称「命之座」，玩家简称「X命」。"
aliases = ["命座"]
slang = ["满命", "几命"]
# ★ 2026-11-09：官方术语名「命之座」已确认（层级叫「X命」）。
#   原 brief 的「提升的进阶层数」是口语说法，已改成官方口径。
#   （本条原本没有校对待办，属任务指定的额外校对重点：命之座正式名。）

[terms."纪行"]
kind = "机制"
brief = "按版本周期推进的通行证玩法（Battle Pass）。"
aliases = ["通行证", "大月卡"]
# TODO(verify): 与正式名称及免费／付费层的区分
# ★ 2026-11-09：正式名称与免费／付费档的**具体道具名**在本工作区找不到权威出处
#   （商城场景的 signals 里同时出现「空月祝福」「珍珠之歌」，但两者的档位归属
#   无法从本工作区确认），故**保留 TODO**。
#   ★ 另注：别名里的「大月卡」是**月卡**的俗名，与纪行不是同一玩法，
#   是否保留需人工确认。
verify_note = "待人工校对：纪行的官方正式名称，以及免费档／付费档各自对应哪个道具名（商城 signals 里的「珍珠之歌」「空月祝福」分别属哪一档待核）；另需确认别名「大月卡」（月卡俗名）是否应移出本条"

[terms."元素能量"]
kind = "机制"
brief = "释放元素爆发所需的能量，由元素微粒与元素晶球回复；「元素充能效率」是提升其回复速度的角色属性，两者不是一回事。"
aliases = ["充能", "元素充能"]
# ★ 2026-11-09：两者已确认为**不同概念**——「元素能量」是元素爆发所需的能量值，
#   「元素充能效率」是角色属性（提升能量回复速度）。原校对待办已移除（2026-11-09）。
#   ★ 别名口径：本条的「充能」「元素充能」按**玩家口语**指向「回充能」这件事
#   （即能量值本身），与「元素充能效率」属性分开理解，不构成混淆。

[terms."秘境"]
kind = "机制"
brief = "消耗体力进入的副本，用于获取圣遗物、天赋书与武器突破材料。"
