# ===========================================================================
# 连招配置（玩家写的那份）
# ===========================================================================
#
# 【不写这个文件会怎样】
#   什么都不发生。引擎退回**纯反射模式**：只有 rules/*.toml 生效，
#   连招一条都不跑。这是**正常配置**，不是故障。
#   —— 反过来：文件写了但写坏了，引擎会**启动失败并指名道姓报错**，
#   不会偷偷跳过你的连招。
#
# ===========================================================================
# ★★ 这里**不写角色名**，只写位置
# ===========================================================================
#   队伍组合是 A(120) 的 4 阶乘 —— 两亿多种。写死「钟离+夜兰」的
#   配置对任何具体队伍都**只对一次**：换个队伍，技能就全打在队友身上，
#   而且**不会报错**（切得到人，只是切错了）。
#
#   所以每一步只有三种写法，含义互斥：
#
#     { slot = 2,  action = "USE_BURST" }   第 2 号位是谁就动谁
#     { onfield = true, action = "..." }    ★ 当前在场的那个人，**永不切人**
#     { char = "夜兰", action = "..." }     老写法（按名字），新配置别用
#
#   「谁在 2 号位」由大世界 OCR 实时读出来，**不由本文件决定**。
#   名册启动后约 20 秒填满；没填满时 slot 式步骤会跳过并发
#   COMBO_STEP_UNKNOWN —— 是**响亮跳过**，不是静默不动。
#
# 【与 rules/*.toml 的关系】
#   - 连招进行中，普通规则里 priority < break_below_priority 的会
#     **打断**它（默认 20：恢复类、闪避、被围后退…）。
#   - 其余普通规则在连招跑完之前让路，包括 85 的普攻兜底。
#   - 连招的每一步产出的都是普通 IntentPacket，
#     **validator / safety / traits 一视同仁**，没有后门。
#
# 【隐式切人】
#   你写 { slot = 2, action = "USE_BURST" }，引擎会先查 OCR 名册
#   「2 号位现在是谁」，不是他就先发一个 SWITCH_CHARACTER，等切完再放大招。
#   写 onfield = true 则**完全不切人** —— 这是「通用战斗」的写法。
#
# 【DSL】
#   trigger 和每步的 when 用的是和规则**同一套** DSL、同一份白名单
#   （policy/dsl.py）。写了不认识的函数会在**启动时**报错，不是运行时。
#   常用：has_nearby_enemy() / hp() / e_ready() / q_ready() /
#         scene() / enemy_count()
#   完整列表见 docs/combat_architecture.md。
#
# ===========================================================================

[meta]
# 这个文件的格式版本。将来格式变了会报错让你迁移，而不是默默读错。
version = 1
# 最后一次改动：删掉全部写死的角色名，改成 slot / onfield 位置语义；
# 默认开启的换成一条**队伍无关**的通用战斗。
updated = "2026-10-19"


# ===========================================================================
# 通用战斗（**队伍无关**，默认开着）
# ===========================================================================
# ★ 为什么这条对任何队伍都成立
#   它**从不问「队伍是谁」**：
#     · 谁在场上就动谁（onfield），所以没有「第 2 号位该谁」这个问题；
#     · E 亮了就按，没亮就普攻 —— 普攻对任何角色都是对的。
#   于是「钟离+夜兰」「胡桃+行秋+钟离」用的是**同一份配置**。
#
# ⚠️ 开着的代价
#   - 它会**真的按键**。请在引擎页确认执行模式是「完全接管」之前想清楚。
#   - 连招的 `when` 只管「要不要打」，不管「打得对不对」——
#     感知层误报会让它对着空气挥盾。实测误报率约 24%（见
#     tests/unit/test_enemy_filtering.py），**别在城里演示**。
#
# 🔴 出厂默认：**全关**（2026-10-19）
#   这里原来默认开着「通用战斗」+ 两条危机反射，等于双击启动就开始自动按键。
#   实机复盘（run 20261019_000606，273 秒干跑）里它产生了 203 条
#   INTENT_EXECUTED —— 引擎一个键都没发，却像真在打，YUI 照着念战斗播报。
#
#   ⚠️ 连招和反射都**会真的按键**，所以一并关掉，不只是连招。
#     「濒死放大招」看着像保命键，但它的触发条件是感知层判定的血量，
#     而感知层在战斗中会被特效遮挡 —— 误触发时它替你把大招按了出去。
#
#   想开：把对应条目的 enabled 改成 true，**并**在 Console 里点「完全接管」。
#     两件事缺一不可 —— 见 autopilot/core/loop.py 的 DRY_RUN 决策闸门。
[[combo]]
name = "通用战斗"
enabled = false
note = "队伍无关的默认连招：当前在场的人 E 亮了就按，没亮就普攻。它从不问「队伍是谁」，所以对任何队伍都成立。开着的代价是会真的按键，且在城里可能对着空气挥盾（感知层误报率约 24%）"
trigger = "has_nearby_enemy() and scene() == 'WORLD'"
cooldown_ms = 6000
break_below_priority = 20
switch_timeout_ms = 3000
timeout_ms = 12000
ttl_seconds = 2
sequence = [
    # ① 在场的人，E 亮了就按。
    #   没亮就**跳过并切走**（不是卡在原地等）—— 与 has_nearby_enemy
    #   同一套「条件为假不触发」的语义。
    { onfield = true, action = "USE_SKILL", when = "e_ready()", gap_ms = 300 },

    # ② E 不亮就普攻。普攻对任何角色都是对的，所以这一步**不需要
    #   知道队伍是谁** —— 整条连招的连贯性就靠这一条兜底。
    { onfield = true, action = "NORMAL_ATTACK", repeat = 3 },
]


# ===========================================================================
# 按位置的组合（示例，默认关）
# ===========================================================================
# 这条演示「固定用 1 号位开盾、2 号位爆发」的位置写法。
# 它对**任何**队伍都成立 —— 只是「1 号位」在你这里是谁，由 OCR 说了算。
#
# ⚠️ 为什么默认关
#   队伍只有 4 格，第 1 格未必是**承伤/开盾**型角色。开盾打给输出位
#   是纯浪费。等你在引擎页的「战斗设定」里看清了当前队伍、再把
#   槽位调到合适的位置，再打开它。
[[combo]]
name = "一二号位接力"
enabled = false
note = "按位置的两段接力：1 号位开盾 → 2 号位爆发。对任何队伍都成立，但槽位语义要你自己对（开盾位不一定是 1 号），所以默认关着"
trigger = "has_nearby_enemy() and scene() == 'WORLD'"
cooldown_ms = 10000
break_below_priority = 20
timeout_ms = 15000
sequence = [
    { slot = 1, action = "USE_SKILL", when = "e_ready()", gap_ms = 700 },
    { slot = 2, action = "USE_BURST", when = "q_ready()" },
]


# ===========================================================================
# 模板：四格轮转（配队固定、想要全覆盖时用）
# ===========================================================================
# 逐个位置扫过去，每个人 E 亮了就按。名册不满 4 格时，后面的步骤会被
# COMBO_STEP_UNKNOWN 跳过 —— 响亮跳过，不会切错人。
#
# [[combo]]
# name = "四格轮转"
# enabled = false
# note = "1~4 号位依次尝试开 E，谁亮谁按。名册不满时会跳过空位并发 COMBO_STEP_UNKNOWN"
# trigger = "has_nearby_enemy() and scene() == 'WORLD'"
# cooldown_ms = 8000
# sequence = [
#     { slot = 1, action = "USE_SKILL", when = "e_ready()", wait = "ready" },
#     { slot = 2, action = "USE_SKILL", when = "e_ready()", wait = "ready" },
#     { slot = 3, action = "USE_SKILL", when = "e_ready()", wait = "ready" },
#     { slot = 4, action = "USE_SKILL", when = "e_ready()", wait = "ready" },
# ]
#
# ★ 注意这里每一步都带 wait = "ready"
#   四格轮转是切人最频繁的一种 —— 每一步都要换一个位置。
#   不带 wait 的话，引擎会在上一个人的技能后摇里就切走，
#   四步下来大概率一步都没放出来，而日志里一条错误都没有。
#   这正是 BetterGI 反射表里每条动作串尾部都挂 ready 的原因。


# ===========================================================================
# 蓄力爆发轮转（示例，默认关）—— 用上 wait / until / jump_to
# ===========================================================================
# 这条是**第一个**用到全部三个流程控制原语的示例，也是
# 「能量不够就先去攒球」这个真实需求的最短写法。
#
# ★ 它在干什么
#   1. 让 2 号位（有爆发的那一格）开 E
#   2. **等这一下真的放出来了**（wait = "ready" + until），
#      再切走 —— 不会在技能后摇里把人切掉
#   3. 大招亮了就放
#   4. 大招不亮？**不结束，去普攻攒球，跳回第 3 步重来**
#      —— 这就是 jump_to
#
# ★ 为什么 step 2 要写两条后置条件，缺一不可
#   wait = "ready"  只证明「键按出去了、执行层也做完了」
#   until = "not e_ready()"
#        证明「**游戏里真的放出来了**」。少了它，技能被动画取消
#        （比如切得太快）时连招会以为成功了，接着切人 —— 症状是
#        「大招按了没反应」，日志里一条错误都没有。
#
# ★ 为什么攒球那步写 onfield 而不是 slot
#   攒球谁都能做，指定谁反而限制了配置（要求你必须知道谁占哪格）。
#   onfield = 站在谁身上都行 —— 对 A_120^4 种队伍全部成立。
#
# ⚠️ 默认关着
#   它要求 2 号位真的是「主 C / 爆发位」。队伍 4 格里第 2 格是谁
#   得你自己在「战斗设定」页看清了再改槽位。
[[combo]]
name = "蓄力爆发轮转"
enabled = false
note = "2 号位开 E 并确认放出来了，再切走放大招；大招不亮就普攻攒球并跳回来重试。要求 2 号位是爆发位，所以默认关着"
trigger = "has_nearby_enemy() and scene() == 'WORLD'"
cooldown_ms = 12000
break_below_priority = 20
switch_timeout_ms = 3000
timeout_ms = 25000
sequence = [
    # ⚠️ TOML 的内联表**必须写在一行里**（不能换行续写）。
    #   跨行的话报的是 "Invalid initial character for a key part" ——
    #   一个完全看不出在哪错的错。所以下面每一步都是长长的一行，
    #   解释放在上面的注释里。

    # ① 2 号位开 E。slot 是**隐式切人**，而 wait 在**切人之后**才生效 ——
    #   也就是说引擎会先切到 2 号位，再等它把 E 放完，才继续下一步。
    { slot = 2, action = "USE_SKILL", when = "e_ready()", wait = "ready", until = "not e_ready()" },

    # ② 2 号位放大招。同样的两个后置条件 —— 大招被取消的代价比 E
    #   更大（能量白白清零）。
    { slot = 2, action = "USE_BURST", when = "q_ready()", wait = "ready", until = "not q_ready()" },

    # ③ 大招还没亮 -> 普攻攒球，攒完 **jump_to = 2** 回去重试。
    #   when 为假就跳第 2 步（回到放大招那步）；为真就正常走完。
    #   onfield = 站在谁身上都能攒。
    { onfield = true, action = "NORMAL_ATTACK", when = "not q_ready()", repeat = 4, jump_to = 2 },
]


# ===========================================================================
# 危机反射（默认开）—— 最高优先级，连招走到哪一步都让路
# ===========================================================================
# ★ 这是 BetterGI 反射表里**没有**的一层
#   扒完 bettergi-scripts-list 的 20 张表之后可以确认：那边**只有**
#   动作串 + 三个同步点（wait / check / ready），打断逻辑在 C# 引擎
#   里（CombatScenes.updateActionSchedulerByCd），脚本层看不到。
#   而且它的「遇敌攻击」表达是 ``attack(0.05),dash`` 这种**无条件
#   尾缀**，不是条件判断 —— 每轮都会闪一次。
#   我们这层是**带条件**的，而且优先级高于连招本身。
#
# ★ 命中时会发生什么
#   1. **立刻中止**正在进行的连招（发 COMBO_ABORTED，带原因）
#   2. 发出这条反射的意图（priority 90，高于连招的 70）
#   3. 进入 lock_ms 的**静默锁**：这段时间里连招也不许出手 ——
#      闪避刚按下去就接着放技能，等于把无敌帧浪费掉了
#   4. 冷却 cooldown_ms 之后才可能再次触发
#
# ★ 为什么 low_hp 那条带 q_ready()
#   「用大招躲」不是任何角色都做得到 —— 大招亮着才能放。
#   条件不满足时这条反射**整条不发**，而不是「按了个没反应的 Q」。
[[reflex]]
name = "低血闪避"
enabled = false
note = "血量低于 35% 时闪避。不是无敌帧，只是拉开距离；真正的救命靠下面那条大招"
action = "DODGE"
when = "hp() < 0.35 and scene() == 'WORLD'"
cooldown_ms = 4000
lock_ms = 350

[[reflex]]
name = "濒死放大招"
enabled = false
note = "血量低于 18% 且大招亮着时，用大招的无敌帧硬吃这一下。这是少数「靠技能躲伤害」的情况，条件必须带 q_ready()"
action = "USE_BURST"
onfield = true
when = "hp() < 0.18 and q_ready() and scene() == 'WORLD'"
cooldown_ms = 8000
lock_ms = 600

[[reflex]]
name = "开盾优先"
enabled = false
note = "示例：一个「先给盾再打」的反射。它要求你把 slot 改成真正承伤/开盾的那一格，而且它比连招优先 —— 也就是每轮都会先重新上盾。想清楚再开"
action = "USE_SKILL"
slot = 1
when = "e_ready() and has_nearby_enemy() and scene() == 'WORLD'"
cooldown_ms = 6000
lock_ms = 400

[[combo]]
name = "钟纳夜丝_全自动演示"
enabled = true
note = "演示专用：钟离长按E开盾 -> 纳西妲扫码 -> 夜兰开大 -> 丝柯克站场输出。队伍顺序必须是 1号钟离 / 2号纳西妲 / 3号夜兰 / 4号丝柯克"
trigger = "has_nearby_enemy() and scene() == 'WORLD'"
cooldown_ms = 15000
break_below_priority = 20
switch_timeout_ms = 3000
timeout_ms = 20000
ttl_seconds = 2
sequence = [
    # ★ 不写显式的 SWITCH_CHARACTER 步骤！
    #   带 `char` 的动作步**自己就会隐式切人**（引擎发现目标不在场
    #   就先发一个切人，等切完再做动作）。
    #   外面再写一遍显式切人 = 连发两次切人指令，第二次会被
    #   traits 的 min_gap_ms=200 拦成 MIN_GAP ->
    #   切人没记账 -> 连招卡在「等切人生效」-> 3 秒后整条中断。
    #   （2026-10-19 实机就是这个症状。）
    { char = "钟离", action = "USE_SKILL", hold_ms = 1500, when = "e_ready()", wait = "ready" },
    { char = "纳西妲", action = "USE_SKILL", when = "e_ready()", wait = "ready" },
    { char = "夜兰", action = "USE_BURST", when = "q_ready()", wait = "ready" },
    { char = "丝柯克", action = "NORMAL_ATTACK", repeat = 4 }
]
