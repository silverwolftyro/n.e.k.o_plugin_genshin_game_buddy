# N.E.K.O. 键位配置
#
# 改完直接生效。值写 VK 名（W / E / SHIFT / LBUTTON / F12…）、
# 0x 前缀十六进制，或 "NONE"（该动作不发按键）。
#
# ⚠ 方向键与队伍槽位键**不在这里配** —— 它们是硬编码的，
#   改了会破坏导航与切人逻辑。
#
# 用 keymap_editor 交互式编辑：
#   python -m autopilot.tools.keymap_editor

[keymap]

# ---- COMBAT ----
NORMAL_ATTACK = "LBUTTON"
USE_SKILL = "E"
USE_BURST = "Q"
DODGE = "SHIFT"
SWITCH_CHARACTER = "ONE"

# ---- NAV ----
MOVE_FORWARD = "W"
MOVE_BACK = "S"
MOVE_LEFT = "A"
MOVE_RIGHT = "D"
SPRINT = "SHIFT"
JUMP = "SPACE"

# ---- UI ----
OPEN_INVENTORY = "B"
OPEN_MAP = "M"
OPEN_PAIMON_MENU = "ESCAPE"
CLICK_ELEMENT = "LBUTTON"
CONFIRM = "ENTER"
CANCEL = "ESCAPE"
CLOSE = "ESCAPE"

# ---- SYSTEM ----
WAIT = "NONE"
SCREENSHOT = "NONE"
NOOP = "NONE"

# ============================================================================
# 编队槽位：角色名 -> 1..4 号位（2026-10-18）
# ============================================================================
# ★ **必须自己填**，仓库里不预置 —— 编队是每个玩家自己的信息。
#   留空 = 空表 = `SWITCH_CHARACTER` 找不到该切谁，会**跳过并在 steps 里
#   记一笔**（不是静默无事发生）。
#
# 🔴 左边那个 key **必须和队伍栏 OCR 读出来的名字一字不差**
#    —— 它要和 rules/genshin_combat.toml 里 onfield('...') 的参数、
#    以及 terms/genshin/characters.toml 白名单里的写法，三者对齐。
#    OCR 侧会对结果做编辑距离纠错（terms 里共 125 条角色名），
#    但纠错只保证「是个合法角色名」，不保证「是你队里那个」。
#
# 举例（队伍是 1=钟离 2=夜兰 3=纳西妲 4=神里绫华）：
#
#     [char_slots]
#     "钟离"     = 1
#     "夜兰"     = 2
#     "纳西妲"   = 3
#     "神里绫华" = 4
#
# ⚠ 换队伍后记得回来改 —— 改错了不会报错，只会让切人按错号。
#   值必须落在 1~4，写成别的会**启动即报错**（KeymapError），
#   因为那一定是写错了。
[char_slots]
"钟离" = 1
"纳西妲" = 2
"夜兰" = 3
"丝柯克" = 4
