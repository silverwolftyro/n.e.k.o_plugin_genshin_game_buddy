# ============================================================================
# 原神 · 战斗规则
# ============================================================================
#
# 场景：COMBAT（由 perception 的场景识别给出）
#
# ★ priority 数字越小越优先（升序遍历，命中即停）。
#   间隔 10/20/30/40/50/60/70/80/90 刻意留空 —— 中间插新规则不用重排全表。
#
# ⚠⚠ 已知限制：暂时用 scene() == 'COMBAT' 近似「有敌人」 ⚠⚠
#   StatePacket 里**没有** has_enemy 字段（第 1 期契约不含该信号）。
#   所以现在「识别成战斗场景」就当作「有敌人」，机器人会在进入战斗场景后
#   无条件开火 —— 包括队友满血、敌人已经跑远的情况。
#   等 YOLO 训出敌人检测后，把下面的 has_enemy() 占位规则取消注释启用，
#   并给所有战斗规则加上 has_enemy() 前置条件。详见 policy/context.py 的
#   PolicySignals 说明。
#
# 依赖的 context 函数：hp() energy() q_ready() e_ready() onfield()
#                       since() scene() pos_usable() perception_ok()
# ============================================================================

# ---------------------------------------------------------------------------
# 保命（最高优先级）—— 血量掉下去什么都白给
# ---------------------------------------------------------------------------

# ============================================================================
# §29 · 二值场景下的战斗规则
# ============================================================================
# ★ 规则按 priority **升序**遍历、**首个命中即停**（local_tree.decide），
#   所以数字**越小越优先**。本节顺序：
#
#   80  ★ E 好就放 E（排在普攻前面 —— E 才是收益大头）
#   85  看见敌人标识才长按普攻
#   10  进场先等一拍
# ---------------------------------------------------------------------------

# ★ E 技能就绪感知接线后的第一条技能规则（2026-10-18）
#
# 依赖：has_nearby_enemy() e_ready()
#
# ⚠️ e_ready() 返回 `bool | UnknownValue`，感知没开时是 UnknownValue。
#   它的 `__bool__` 恒 False、`__eq__` 比任何布尔都不等 —— 所以
#   写 `e_ready()` 和写 `e_ready() == True` 在 UNKNOWN 时**都不触发**，
#   两种都安全。这里写 `== True` 只是为了读起来明确「要的是确认就绪，
#   而不是「不是 False 就行」」。
#
# ⚠️ 感知默认关着（autopilot.skill_cd.enabled = false），此时 e_ready()
#    恒 UNKNOWN，这条规则恒不触发 —— 与接入之前行为完全一致。
#    开关 + 标定警告见 autopilot/config/loader.py 的 SkillCdConfig。
[[rules]]
name = "world_use_skill_if_ready"
action = "USE_SKILL"
when = "has_nearby_enemy() and e_ready() == True"
priority = 80
ttl_seconds = 1
scenes = ["WORLD"]
enabled = true
note = "有敌人且 E 亮着就放 E；E 灰着/看不清则落到 priority 85 的普攻"

# 解决：战斗打完不点领取，奖励拿不到。
# 依赖：scene()
# ⚠ 这个场景根本不在"战斗"里，放 priority 10 只是因为它最该立刻处理。

# ============================================================================
# §30 · 连招 —— 已迁走（2026-10-18）
# ============================================================================
# 这里原来有 7 条 `combo_*` 规则（priority 62~68），把「钟离 → 夜兰 →
# 纳西妲 → 神里绫华」摊成一条梯子，靠 `onfield()` 守卫串起来。
#
# ★ 为什么删掉
#   那套写法把**一个玩家的队伍**写进了代码。而队伍是玩家自己配的：
#   四个人 4! = 24 种顺序，能跑通的更少（每条切人规则的守卫是
#   「上一个角色还在场」，写错就乒乓且**不报错**）。换一队就整条失效 ——
#   而且失效方式是「一条都不触发」，屏幕和日志上什么都看不出来。
#
# ★ 搬去哪了
#   `autopilot/combos/combos.toml` —— 一条 `[[combo]]`：
#     · 角色顺序写在 `sequence` 里，不用再抢 priority 位置；
#     · **切人由引擎隐式插入**（写 `{ char = "夜兰", action = "USE_BURST" }`
#       它自己先发 SWITCH_CHARACTER 再放大招），不用手写「切过去」那些规则；
#     · 连招跑着的时候 priority < 20 的规则（恢复类 / 闪避 / 被围后退）
#       仍然能**打断**它 —— 「没血了立刻停」这条需求没有被牺牲；
#     · 连招的每一步产出的都是普通 IntentPacket，照样过 validator + safety。
#
#   没配 `combos.toml` 时引擎退回**纯反射模式**（只有本文件的规则生效），
#   与本次改动之前的行为一致。
#
#   想看原来那七条：版本历史里搜 `combo_zhongli_shield`。
# ============================================================================


[[rules]]
name = "world_attack_only_with_enemy"
action = "NORMAL_ATTACK"
when = "has_nearby_enemy()"
priority = 85
ttl_seconds = 2
scenes = ["WORLD"]
enabled = true
note = "看见敌人标识才长按普攻"

# 低血 + 有敌人 -> 闪避。§30 给 DODGE 的 allowed_scenes 加了 WORLD，
# 不然这条规则在二值场景下过不了 traits 的场景校验。
# 依赖：has_nearby_enemy() hp()

# --------------------------------------------------------------------------
# 进场先等一拍（2026-10-11 从 _future 挪回）
# --------------------------------------------------------------------------
# ★ 之前被误判为死规则：当时用合成的 StatePacket 探测 DSL，
#   那个夹具没带 scene.entered_ms，于是 since() 恒 UNKNOWN。
#   但 builder.py:592 **一直**在设 entered_ms（_track_scene_enter），
#   所以 since() 在生产里是真值。这条从来都能跑。
[[rules]]
name = "combat_settle_on_enter"
action = "WAIT"
when = "since() < 500"
priority = 60
ttl_seconds = 1
scenes = ["COMBAT"]
params = { ms = 500 }
enabled = false
note = "进场景先等 0.5s 稳定"

# ---------------------------------------------------------------------------
# 兜底（最低优先级）
# ---------------------------------------------------------------------------
#
# ⚠️ 2026-10-03 **删除了 combat_normal_attack_default**（原 priority 90）。
#
# ⚠️ 但要说清楚：删它**不是安全操作，是清理死代码**。原规则
#    ``when = "scene() == 'COMBAT'"`` + ``scenes = ["COMBAT"]``
#    + ``enabled = false`` —— **三条各自独立的原因让它本来就不会触发**：
#      1. ``enabled = false``
#      2. ``scenes = ["COMBAT"]``，而 §28 之后场景是二值的，永不产出 COMBAT
#    所以它从来没抢过风，也不存在"删了才安全"这回事。
#
#    真正取代它的是下面 §29 的 ``world_attack_only_with_enemy``
#    （priority 85、scenes=["WORLD"]、enabled=true、依赖 has_nearby_enemy()）。
#    两者不是同一件事：兜底规则是"是战斗场景就打"，新规则是
#    **"看见敌人标识才打"** —— 后者才是我们要的语义。

# ============================================================================
# 以下是 has_enemy() 的占位规则 —— 感知层产出该信号后取消注释启用
# ============================================================================
#
# ⚠️ **这些占位规则已被 §29 的同名能力取代，别再用它们。**
#    它们依赖 ``has_enemy()``（PolicySignals 里**手动声明**的信号，
#    默认 None -> UNKNOWN），而 §29 用的是 ``has_nearby_enemy()``
#    （bgi_world **实际检出**）。两个名字很像、来源不同 —— 见
#    policy/context.py 的注释。

# 占位：退出战斗结算界面（需要「奖励已领取」的 OCR 判定，当前不可用）
